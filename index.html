<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F2FA;--card:#FFFFFF;--ink:#17153B;--muted:#5B5878;--faint:#8F8CA8;
  --line:#E3E1F1;--hover:#F1EFFB;--accent:#512FD8;--accent-2:#7A36EC;--accent-soft:#E6DCFE;
  --pass:#0E6B3F;--pass-bg:#D5F2E1;--warn:#855000;--warn-bg:#FFEBB8;--fail:#A31D2B;--fail-bg:#FDD9DC;
  --font:"Inter",ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Space Grotesk","Inter",ui-sans-serif,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --base:15px;--h1:32px;--r:14px;--rb:10px;--dstyle:dashed;
  --sh1:0 1px 2px rgba(30,20,90,.06),0 4px 12px rgba(30,20,90,.06);
  --sh2:0 2px 4px rgba(30,20,90,.06),0 10px 24px rgba(30,20,90,.10),0 24px 48px rgba(30,20,90,.06);
}

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font:var(--base)/1.55 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit}
header.top{position:sticky;top:0;z-index:10;color:var(--ink);background:linear-gradient(115deg,#E4E7FD 0%,#EEE7FE 48%,#F6ECFF 100%);box-shadow:0 2px 10px rgba(60,40,140,.12)}
.top-in{max-width:960px;margin:0 auto;padding:12px 24px 0}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand i{width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,#5B3CE0,#8B5CF6);display:inline-block;transform:rotate(45deg);box-shadow:0 1px 4px rgba(91,60,224,.35)}
.brand-sub{color:var(--muted);font-weight:400;margin-left:6px}
.steps{display:flex;gap:6px;margin:14px 0 0;list-style:none;padding:0}
.steps li{flex:1}
.steps button{all:unset;cursor:pointer;display:flex;align-items:center;width:100%;box-sizing:border-box;padding:8px 4px 10px;font-size:13px;font-weight:500;color:#7A7699;letter-spacing:.01em;border-bottom:3px solid rgba(91,60,224,.16);transition:color .2s,border-color .2s}
.steps button .n{font-family:var(--display);font-size:11.5px;font-weight:700;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-right:8px;border:1.5px solid rgba(91,60,224,.35);color:var(--accent);transition:all .2s}
.steps li.done button{color:var(--ink);border-bottom-color:rgba(91,60,224,.55)}
.steps li.done button .n{background:rgba(91,60,224,.14);border-color:transparent;color:var(--accent)}
.steps li.cur button{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.steps li.cur button .n{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 0 4px rgba(91,60,224,.18)}
.steps button:hover:not(:disabled){color:var(--ink)}
.steps button:disabled{cursor:default}
main{max-width:960px;margin:0 auto;padding:36px 24px 40px}

/* per-screen identity: subtle tinted wash behind each screen */
.screen{--wash:rgba(91,60,224,.07);position:relative}
.screen.s0{--tone:hsl(232 68% 53%);--tone-bg:hsl(232 74% 96%)}
.screen.s1{--tone:hsl(243 71% 55%);--tone-bg:hsl(243 76% 96%)}
.screen.s2{--tone:hsl(254 71% 56%);--tone-bg:hsl(254 74% 96%)}
.screen.s3{--tone:hsl(266 68% 56%);--tone-bg:hsl(266 70% 96%)}
.screen.s4{--tone:hsl(224 72% 52%);--tone-bg:hsl(224 74% 96%)}
.screen.s5{--tone:hsl(278 64% 54%);--tone-bg:hsl(278 66% 96%)}
body{background:radial-gradient(900px 420px at 85% -60px,rgba(124,58,237,.10),transparent 70%),radial-gradient(700px 360px at 0 120px,rgba(59,43,184,.07),transparent 70%),var(--bg);background-attachment:fixed}
.pagehead{display:flex;gap:20px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--tone);border-radius:var(--r);box-shadow:var(--sh1);padding:22px 26px;margin-bottom:30px;background-image:linear-gradient(180deg,var(--tone-bg),#fff 70%)}
.pagehead .tx{flex:1}
h1{font-family:var(--display);font-size:var(--h1);line-height:1.15;font-weight:700;margin:0 0 8px;letter-spacing:-.025em}
.lede{color:var(--muted);margin:0;max-width:62ch}
h2{font-family:var(--display);font-size:12.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:600;margin:40px 0 8px}

.btn{all:unset;box-sizing:border-box;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;padding:10px 20px;border-radius:var(--rb);font-size:14px;font-weight:600;border:1px solid transparent;box-shadow:0 1px 2px rgba(60,30,160,.35),0 6px 16px rgba(91,60,224,.36);transition:transform .15s,box-shadow .15s,filter .15s,background .15s,border-color .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 2px 4px rgba(60,30,160,.3),0 10px 22px rgba(91,60,224,.38)}
.btn:active{transform:none;filter:brightness(.95)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.4;cursor:default;filter:none;transform:none;box-shadow:none}
.btn.quiet{background:#fff;color:var(--accent);border-color:var(--line);box-shadow:var(--sh1)}
.btn.quiet:hover{border-color:var(--accent);background:var(--accent-soft);filter:none;transform:translateY(-1px)}
.btn.sm{padding:6px 13px;font-size:13px}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.steps button:focus-visible{outline-color:var(--accent)}
.x{all:unset;cursor:pointer;flex:none;width:28px;height:28px;border-radius:50%;text-align:center;line-height:27px;font-size:18px;color:var(--faint);box-sizing:border-box;transition:background .15s,color .15s}
.x:hover{background:var(--accent-soft);color:var(--accent)}
.link{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.link:hover{filter:brightness(.8)}

/* inputs */
input[type=text],textarea,select{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-bottom-color:var(--line);border-radius:8px;padding:7px 10px;resize:none;overflow:hidden;transition:border-color .15s,background .15s,box-shadow .15s}
select{overflow:visible;border:1px solid var(--line);background:#fff;cursor:pointer}
input[type=text]:hover,textarea:hover{background:var(--hover)}
input[type=text]:focus,textarea:focus,select:focus{outline:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,60,224,.26)}
label.l{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin:20px 0 4px}
.title-in{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.01em}

/* cards: draft (dashed/neutral) vs saved (accent rule) */
.card{position:relative;padding:16px 24px 22px;margin-bottom:18px;border:1px solid var(--line);border-left:4px var(--dstyle) var(--faint);border-radius:var(--r);background:var(--card);color:var(--muted);box-shadow:var(--sh1);transition:border-color .3s,box-shadow .3s,transform .2s}
.card input,.card textarea{color:inherit}
.card.firm{border-left:4px solid var(--accent);color:var(--ink);box-shadow:var(--sh2)}
.card.sel{border-color:var(--accent);border-left-color:var(--accent);box-shadow:0 0 0 3px rgba(91,60,224,.2),var(--sh2)}
.card-h{display:flex;align-items:center;gap:10px;font-size:12px;flex-wrap:wrap}
.card-h.open{cursor:pointer}
.card-h .id,.panel-h .id{font-family:var(--mono);font-weight:700;color:var(--accent)}
.tag{font-family:var(--mono);font-size:11px;color:var(--accent);border:1px solid transparent;padding:1px 8px;border-radius:99px;background:var(--accent-soft)}
.state{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.card-h .link+.state{margin-left:0}
.card.firm .state,.panel-h .state.ok{color:var(--pass)}
.subrow{display:flex;align-items:center;gap:8px}
.subrow:before{content:"";width:6px;height:6px;border:1.5px solid var(--accent);border-radius:2px;flex:none;opacity:.7}
.subrow input{flex:1;width:auto}
.revise{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.revise input{flex:1;min-width:160px;width:auto;border:1px solid var(--line);background:#fff;font-size:13.5px}
.revise .note{font-size:12.5px;color:var(--accent);white-space:nowrap}
.busy{font-size:12.5px;color:var(--accent);animation:pulse 1s infinite;flex:1}
@keyframes pulse{50%{opacity:.35}}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{background:var(--accent-soft)}100%{background:transparent}}
.opts{display:flex;gap:16px;margin-top:6px}
.opts>div{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}

/* save bar */
.bar{position:sticky;bottom:0;padding:10px 0 18px;margin-top:10px;z-index:4;background:linear-gradient(180deg,transparent,var(--bg) 40%)}
.bar-in{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh2);padding:12px 18px}
.bar-msg{flex:1;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.bar-msg.ok{color:var(--pass);font-weight:500}
.bar-msg svg{flex:none}
.kbd{font-size:11.5px;color:var(--faint);white-space:nowrap}
.kbd kbd{font-family:var(--mono);font-size:11px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;color:var(--muted);background:#fff}

/* start */
.drops{display:grid;gap:12px;margin-bottom:14px}
.drop{display:flex;align-items:center;gap:16px;padding:16px 22px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--sh1)}
.drop svg{flex:none;color:var(--accent)}
.drop .fn{font-family:var(--mono);font-size:14px;font-weight:600}
.drop .meta{font-size:12.5px;color:var(--muted)}
.drop .meta .fn{font-size:12.5px;color:var(--ink)}
.drop .grow{flex:1;min-width:0}
.drop.extra input.lbl-in{font-size:13px;font-weight:600;padding:3px 6px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop.empty{justify-content:center;border:2px dashed #A78BFA;background:rgba(255,255,255,.6);box-shadow:none;color:var(--muted);font-size:13.5px;cursor:pointer;width:100%;text-align:center;padding:26px 22px;transition:all .2s}
.drop.empty:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);box-shadow:var(--sh1)}
.drop.empty .fn{font-size:13.5px}
.drop.empty .meta{font-size:12px;color:var(--faint)}
.drop .link+.link{margin-left:4px}
.addrow{margin:0 0 32px}
.how{margin:34px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint)}
.how b{font-weight:600;color:var(--muted)}

const DOC_PRD=`# Product Requirements Document — Provider Lookup & NPI Verification

| | |
|---|---|
| **Owner** | Product, Provider Network Operations |
| **Status** | Draft v2 (post-critique) |
| **Last updated** | 2026-10-05 |
| **Upstream data source** | CMS NPPES NPI Registry API v2.1 — \`https://npiregistry.cms.hhs.gov/api/\` (public, unauthenticated) |
| **Related docs** | \`design.md\`, \`api-spec.md\`, \`stories.json\`, \`test-plan.md\`, \`test-cases.json\`, \`proof-report.md\` |

---

## 1. Problem statement

Our Enrollment & Credentialing department onboards and re-credentials thousands of practitioners and facilities every year. Every one of those files begins with an NPI, and every downstream process — claims adjudication, directory publication, delegated-credentialing audits, CMS and state network-adequacy filings — inherits whatever we recorded at intake. When the NPI or its associated attributes are wrong, the cost is paid months later and in places far from the root cause.

Today, verification is a manual, inconsistent practice:

* **Analysts open the NPPES web UI in a browser tab**, search by name, eyeball the result against the application, and paste values into the credentialing system. There is no record of *what* was checked, *when*, or *by whom*. In an NCQA or URAC audit, "primary source verification of NPI" is attested to by a checkbox, not by evidence.
* **Typos survive intake.** A single transposed digit in an NPI either points to a different real provider (a silent, dangerous mismatch) or to nothing. NPPES does *not* validate the check digit server-side — we confirmed that a Luhn-invalid NPI returns \`{"result_count":0}\` rather than an error — so "no results" is ambiguous between "mistyped" and "doesn't exist".
* **Name and taxonomy drift goes unnoticed.** Providers change names, add and drop taxonomy codes, relocate practices, and are deactivated. NPPES is self-reported and updated by the provider, so its \`last_updated\` date matters. Our records are rarely compared to it after the initial enrollment.
* **LOCATION versus MAILING addresses are conflated.** NPPES stores both. Directory and network-adequacy work needs the practice location; analysts routinely copy the mailing address (often a billing office, a PO box, or — for sole proprietors — a home address).
* **Volume work is impractical.** Roster onboarding for a new medical group (hundreds of NPIs) is done one NPI at a time, or not done.
* **Shared, unprotected effort.** The public API is shared infrastructure. Ad-hoc scripts written by individual analysts hammer it without caching or back-off, and are fragile when NPPES changes behavior.

### Impact (baseline hypotheses to be measured in pilot)

| Pain | Observable symptom | Pilot metric |
|---|---|---|
| Wrong/mistyped NPIs at intake | Claim rejections, directory complaints | % of enrollments with NPI mismatch found post-intake |
| No audit trail | Audit findings on primary source verification | % of credential files with verification evidence |
| Slow manual search | Analyst minutes per verification | Median time to verify one provider |
| Stale data | Directory inaccuracy, member complaints | % of active providers re-verified in last 12 months |

---

## 2. Target users

| Persona | Role | Primary needs |
|---|---|---|
| **Dana — Enrollment Analyst** | Keys new provider applications daily | Fast, forgiving lookup; instant confidence that the NPI belongs to the person on the application; no copy/paste errors |
| **Marcus — Credentialing Specialist** | Builds and maintains credential files for committee review | Defensible, time-stamped evidence of primary source verification; clear flags for deactivated NPIs and discrepancies |
| **Priya — Provider Data Steward** | Owns directory and roster data quality | Batch verification for medical group rosters and periodic re-verification sweeps; exportable discrepancy lists |
| **Lee — Compliance / Audit Liaison** | Responds to NCQA, URAC, CMS, state audits | Searchable audit log of every lookup and verdict |
| **Sam — Platform Admin** | Operates the tool | Control over access, cache, and upstream load; observability |

Out of the user set: members, providers themselves, and external partners (no external access in any phase).

---

## 3. Goals and non-goals

### Goals

1. **Cut time-to-verify** a single provider from minutes of browser work to under 30 seconds, including documenting the result.
2. **Eliminate ambiguous "not found"** — distinguish malformed NPI, check-digit failure, unregistered NPI, and upstream failure.
3. **Make every verification evidentiary**: who, when, what query, what NPPES returned (including NPPES \`last_updated\`), and what verdict we reached.
4. **Surface discrepancies** between our enrollment record and NPPES (name, primary taxonomy, practice location, status) in a structured, reviewable way.
5. **Support roster-scale work** (up to 500 NPIs per batch) without abusing NPPES.
6. **Be a good API citizen**: cache, rate-limit, and back off so one department never causes an upstream incident or an IP block.

### Non-goals

* **Not a credentialing system of record.** We do not store licenses, DEA, board certification, sanctions, or malpractice history. NPPES does not provide them; separate primary sources (state boards, OIG LEIE, SAM.gov, ABMS) are out of scope for v2.
* **Not an NPPES write path.** We never create or update NPIs; providers do that in NPPES.
* **No auto-correction of enrollment records.** The tool flags discrepancies; humans decide. (Write-back to the credentialing system is a Phase 3 candidate.)
* **No mirror of the full NPPES dissemination file.** We may revisit a bulk-file-backed search if API limits become a blocker; it is not in v2.
* **No external/provider-facing access.**
* **No claim of "licensed" or "credentialed" status.** An active NPI means the identifier is active. The UI must never imply licensure or network eligibility.

---

## 4. Requirements

Priority: **P0** = must ship in Phase 1; **P1** = Phase 2; **P2** = Phase 3 / stretch.

### REQ-001 — Direct NPI lookup with check-digit validation (P0)
The user can enter a 10-digit NPI and retrieve the matching registry record. Before any upstream call, the client and server MUST validate length (10 digits, numeric, whitespace/hyphens stripped) and the Luhn check digit computed with the CMS \`80840\` prefix. Invalid input is rejected with a specific message (not 10 digits vs. check digit fails) and no upstream call is made. A well-formed NPI with zero results is reported as "valid NPI format, not found in NPPES".
*Rationale:* NPPES does not validate check digits; both mistyped and nonexistent NPIs produce \`result_count: 0\`.

### REQ-002 — Individual provider search (NPI-1) (P0)
The user can search individuals by \`last_name\` (required) with optional \`first_name\` and \`state\`, executed with \`enumeration_type=NPI-1\`. Trailing wildcards are supported only with at least two leading characters (matching NPPES error 03); the UI prevents submitting a shorter wildcard. Name matching is displayed as-returned; the UI does not claim fuzzy matching beyond what NPPES provides.

### REQ-003 — Organization search (NPI-2) (P0)
The user can search organizations by \`organization_name\` (trailing wildcard allowed, ≥2 leading chars) with optional location filters, executed with \`enumeration_type=NPI-2\`. Results display the legal business name and any \`other_names\` of type "Doing Business As", and the authorized official's name and title where present.

### REQ-004 — Search filters and minimum-criteria guard (P0)
Users can narrow searches with \`taxonomy_description\`, \`city\`, \`state\`, and \`postal_code\`. The tool enforces NPPES's rule that \`state\` cannot be the sole criterion (error 07) by blocking submission client-side with an explanation. Postal codes accept 5-digit or 9-digit input. Taxonomy description is selected from a typeahead of known descriptions where available but accepts free text.

### REQ-005 — Paginated results with honest counts (P0)
Search results are paginated using NPPES \`limit\` and \`skip\`. Page size is user-selectable (10, 25, 50, 100, 200; default 25; never above 200). Because NPPES \`result_count\` reflects the size of the *returned page* and not a grand total, the UI MUST NOT display a total ("of N") and instead shows "Showing X–Y" with Next enabled when a full page was returned. Paging depth is capped at 1,000 records per query, after which the UI prompts the user to narrow criteria.

### REQ-006 — Provider detail view (P0)
Selecting a result opens a detail view presenting: NPI, enumeration type, status, enumeration date, \`last_updated\`; name/credential (NPI-1) or organization data (NPI-2); the **primary taxonomy** visually distinguished from other taxonomies, each with code, description, license number and state; **LOCATION and MAILING addresses presented separately and labeled**; phone; \`other_names\`; \`identifiers[]\`; \`endpoints[]\`; and \`practiceLocations[]\` where present. Postal codes are formatted (ZIP+4) from the unhyphenated 9-digit form NPPES returns. For \`sole_proprietor: YES\` records a notice warns that listed addresses may be a residence.

### REQ-007 — Verification against the enrollment record (P0)
Given an NPI and a set of submitted attributes (name, credential, primary taxonomy code, practice state/ZIP), the tool compares them to NPPES and returns a per-field result — **MATCH**, **MISMATCH**, or **NOT_PROVIDED** — and an overall verdict: **VERIFIED**, **REVIEW** (any mismatch), or **FAILED** (NPI not found, deactivated, or enumeration type wrong). Comparison is case-insensitive, whitespace- and punctuation-normalized, compares against all \`other_names\` as well as the primary name, and compares taxonomy against *all* taxonomies while noting whether the match was the primary one. A deactivated NPI (\`basic.status\` ≠ \`A\`) always yields FAILED regardless of other matches. (Open item: the API may omit deactivated NPIs entirely, in which case they surface as not-found; both paths yield FAILED and the not-found message mentions possible deactivation. To be confirmed against a known deactivated NPI in week 1.) The verification can be saved as an evidence snapshot (REQ-012) and exported as PDF and JSON.

### REQ-008 — Batch verification (P1)
A Data Steward can upload a CSV of up to 500 rows (\`npi\` required; optional name, taxonomy, state, ZIP) and receive per-row verdicts per REQ-007. Processing is asynchronous with visible progress, honors upstream rate limits (REQ-011), tolerates partial failure (failed rows are reported, not fatal), is cancellable, and yields a downloadable CSV with verdict, per-field results, and NPPES \`last_updated\`. Malformed rows are reported with row numbers and do not abort the batch.

### REQ-009 — Error handling and messaging (P0)
All NPPES failure modes are mapped to actionable user messages. Critically, NPPES returns validation errors with **HTTP 200** and an \`Errors[]\` body (\`{description, field, number}\`); the integration layer MUST treat the presence of \`Errors\` as failure. Known codes (03, 05, 06, 07, 17) map to field-level messages. Transport failures (timeout, 5xx, DNS, connection reset) are retried with bounded exponential backoff and surfaced as "NPPES is temporarily unavailable" — never as "no results". Unknown error numbers are shown generically with the raw description available under "details" and logged.

### REQ-010 — Caching with visible freshness (P0)
NPI lookups are cached for 24 hours; search results for 1 hour; negative results ("not found") for 15 minutes; errors are never cached. Every result shows when it was retrieved from NPPES ("Retrieved 2026-10-05 14:02 UTC · cached") alongside NPPES's \`last_updated\`. A user with the Verifier role can force a refresh that bypasses the cache; verification snapshots (REQ-012) always use a fresh fetch.

### REQ-011 — Upstream protection and resilience (P0)
All NPPES traffic originates from the server-side proxy (never directly from browsers). The proxy enforces a global concurrency ceiling (default 4 in-flight), a token-bucket rate (default 5 requests/second), de-duplicates identical in-flight requests (single-flight), honors \`Retry-After\` if ever returned, and opens a circuit breaker after sustained failure, serving stale cache entries (flagged as stale) where available. Limits are configurable without redeploy.

### REQ-012 — Audit trail and evidence snapshots (P0)
Every lookup, search, verification, batch run, export, and forced refresh is written to an append-only audit log containing: user ID, role, UTC timestamp, action, normalized query parameters, result NPIs (not full payloads for searches), verdict where applicable, cache hit/miss, and request ID. Verification evidence snapshots store the full NPPES payload used, its hash, and the comparison result, immutable once written. Retention: 7 years (aligned to our records-retention schedule). Compliance users can search/filter the log and export it.

### REQ-013 — Access control and data handling (P0)
Authentication via corporate SSO (OIDC). Three roles: **Viewer** (search, view), **Verifier** (+ verify, batch, refresh, export), **Auditor** (read-only on audit log and snapshots). Admin settings sit behind a separate **Admin** role. Although NPPES is public data, search activity reveals enrollment pipeline information and is therefore access-controlled and logged. No NPPES data is stored beyond the cache and evidence snapshots; free-text user input is never written to application logs beyond the audit record.

---

## 5. Non-functional requirements

* **Performance:** p95 server overhead ≤ 150 ms on cache hit; p95 end-to-end ≤ 3 s on cache miss under normal NPPES latency (observed ~0.4–1.2 s per call).
* **Availability:** 99.5% business-hours availability; degrade gracefully (stale cache) when NPPES is down.
* **Accessibility:** WCAG 2.1 AA; full keyboard operation; verdicts never conveyed by color alone.
* **Browser support:** current and previous major versions of Edge, Chrome, Safari.
* **Security:** OWASP ASVS L2 baseline; all inputs validated server-side; CSV uploads size-limited and formula-injection-safe on export (cells starting with \`= + - @\` prefixed).
* **Observability:** structured logs, metrics for upstream latency/error rate/cache hit ratio/rate-limiter wait, alerting on circuit open.

---

## 6. UX notes

* **One search box, smart routing.** A single input accepts an NPI or a name; a 10-digit numeric string routes to NPI lookup. An "Advanced" panel exposes the full filter set. Keep the common path (paste an NPI → get a verdict) to one screen and ≤ 2 interactions.
* **Verification is a first-class mode**, not a hidden feature: "Verify" tab with the enrollment fields on the left, NPPES record on the right, and a field-by-field comparison between them with textual badges (✔ Match / ✖ Mismatch / — Not provided), not just color.
* **Make the not-found taxonomy explicit.** Four distinct empty/error states: *Invalid format*, *Check digit failed (likely typo)*, *Valid format but not found in NPPES*, *NPPES unavailable — retry*. Each with a recommended next action.
* **Deactivated NPIs get a banner** at the top of the detail view and in list rows, with the deactivation context NPPES provides.
* **Show provenance on every screen**: "Source: CMS NPPES · Retrieved … · NPPES last updated …". Analysts quote this to auditors.
* **Address labeling**: "Practice Location" and "Mailing Address" as separate cards; never merge, never abbreviate to "Address".
* **Results table**: NPI, name/org, type, primary taxonomy, practice city/state, status, last updated. Sortable on the current page only (the UI states this) because NPPES controls ordering.
* **Copy affordances**: one-click copy of NPI, and "Copy verification summary" for pasting into the credentialing system until write-back exists.
* **Batch**: drag-and-drop CSV, template download, pre-flight validation summary ("483 valid, 17 rows with problems") before the run starts.
* **Accessibility**: focus management after search, \`aria-live\` for result counts and errors, table headers properly scoped.

---

## 7. Rollout and phasing

### Phase 1 — Pilot (target: 6 weeks)
Scope: REQ-001–007, 009–013 (single-record flows, audit, SSO/RBAC, caching, rate-limiting). Audience: 8–10 Enrollment Analysts and 2 Credentialing Specialists. Exit gate: pilot success criteria below, no open Sev-1/Sev-2 defects, security review passed.

### Phase 2 — Department GA (+6 weeks)
Scope: REQ-008 batch verification; discrepancy reporting; scheduled re-verification sweeps for active providers (nightly low-priority queue, off-peak, strict budget). Training and documentation; deprecate unaudited ad-hoc scripts.

### Phase 3 — Integration (backlog, subject to approval)
Credentialing-system integration (API to attach evidence snapshots to a file; write-back of corrected fields with approval); evaluate NPPES bulk-file mirror; monitoring of NPPES change feeds for providers in network.

### Feature flags and rollback
Batch, forced refresh, and scheduled sweeps are individually flagged. Rollback is a flag-off plus the manual NPPES web UI path, which remains available throughout.

### Success criteria (pilot)

| Metric | Target |
|---|---|
| Median time to verify one provider (incl. documentation) | ≤ 30 s (baseline measured pre-pilot) |
| Verifications with a saved evidence snapshot | ≥ 95% of pilot enrollments |
| NPI keying errors caught pre-submission by check digit | Tracked; expected > 0 |
| Upstream NPPES error rate attributable to the tool | < 1% and zero IP blocks |
| Analyst satisfaction (survey) | ≥ 4 / 5 |

---

## 8. Assumptions, dependencies, risks

* **Assumption:** NPPES API v2.1 remains available and unauthenticated. No SLA exists; we design for outages.
* **Assumption:** NPPES data is self-reported and may be stale or wrong; it is *one* source, not truth.
* **Dependency:** Corporate SSO (OIDC), audit-log storage with 7-year retention, outbound HTTPS egress allow-list for \`npiregistry.cms.hhs.gov\`.
* **Risk — undocumented limits:** NPPES publishes no formal rate limit; we operate conservatively and monitor. *Mitigation:* REQ-011.
* **Risk — over-trust:** users read "Active NPI" as "credentialed". *Mitigation:* UX copy, training, and explicit non-goal.
* **Risk — PII:** sole proprietors' addresses may be residences. *Mitigation:* warning banner (REQ-006), access control (REQ-013), no secondary storage.

## 9. Open questions

1. Which credentialing platform and API will Phase 3 target, and who owns the integration?
2. Does Compliance require a longer than 7-year retention for evidence snapshots for delegated entities?
3. Should REVIEW verdicts require a reviewer disposition (accept/reject) recorded in the tool, or remain advisory until Phase 3?

const DOC_DESIGN=`# Technical Design — Provider Lookup & NPI Verification

| | |
|---|---|
| **Status** | Draft v2 (post-critique) |
| **Owner** | Tech Lead, Provider Data Platform |
| **Implements** | REQ-001 … REQ-013 (\`prd.md\`) |
| **Upstream** | CMS NPPES NPI Registry API v2.1 (\`api-spec.md\` Part A) |

## 1. Context and design drivers

1. **The upstream is public, unauthenticated, unmetered on paper, and unsupported (no SLA).** It must be treated as a shared, fragile dependency. Every design choice that touches it favors fewer calls and graceful degradation.
2. **The upstream's contract has sharp edges** discovered by live probing: validation errors come back as HTTP 200 + \`Errors[]\`; check digits aren't validated; \`result_count\` is page-size, not a total; \`limit\` silently clamps at 200; \`Cache-Control: no-store\` precludes intermediary caching.
3. **The output is evidence.** Verification results must be reproducible and defensible months later in an audit, so we snapshot upstream payloads rather than re-deriving them.
4. **Small team, internal tool, modest load** (peak tens of concurrent users, hundreds of lookups/hour, batches of ≤ 500). Prefer boring, operable technology over scale-first architecture.

## 2. Architecture overview

\`\`\`
 ┌────────────┐   HTTPS/OIDC    ┌───────────────────────────────────────────────┐
 │  Browser   │ ──────────────▶ │  Provider Lookup Service (stateless, N≥2)     │
 │  SPA (UI)  │ ◀────────────── │                                               │
 └────────────┘                 │  API layer ─▶ AuthZ ─▶ Input validation       │
                                │       │                                       │
                                │       ▼                                       │
                                │  Lookup/Search/Verification services          │
                                │       │                │                      │
                                │       ▼                ▼                      │
                                │  Cache (Redis)   Evidence/Audit writers       │
                                │       │                │                      │
                                │       ▼                ▼                      │
                                │  NPPES Client     Postgres (audit, snapshots, │
                                │  (limiter,         batches)                   │
                                │   single-flight,  Job queue (Postgres-backed) │
                                │   retry, breaker)       ▲                     │
                                └───────┬─────────────────┼─────────────────────┘
                                        │ HTTPS GET       │
                                        ▼            Batch worker(s)
                            npiregistry.cms.hhs.gov/api/   (low-priority lane)
\`\`\`

### Technology choices (proposed; adjustable to org standards)

| Concern | Choice | Why |
|---|---|---|
| Service | TypeScript/Node 22 (Fastify) *or* org-standard JVM service | Team skills; strong JSON handling; either is fine — the design is stack-neutral |
| UI | React SPA, served by the same service | Single deployable; SSO handled server-side |
| Cache | Redis | TTLs, atomic ops for token bucket and single-flight locks, shared across replicas |
| Persistence | PostgreSQL | Audit log, snapshots, batches; transactional; 7-year retention via partitioning |
| Jobs | Postgres-backed queue (\`SKIP LOCKED\`) | Avoids a new broker for ≤ 500-row batches |
| Auth | OIDC with corporate IdP; server-side session | No tokens in browser storage |
| Observability | OpenTelemetry → existing stack; Prometheus metrics | Org standard |

## 3. Components

### 3.1 API layer
Fastify routes per \`api-spec.md\` Part B. Responsibilities: authentication, role enforcement (REQ-013), request-ID assignment, schema validation, uniform error envelope, per-user rate limit (60 req/min interactive) to protect the proxy from a single runaway tab or script.

### 3.2 Input validator (\`npi.ts\`, \`searchCriteria.ts\`)
Pure, dependency-free functions, shared with the UI via a small package so client and server cannot drift (REQ-001, REQ-002, REQ-004).

* \`normalizeNpi(s)\`: strip whitespace/hyphens; reject non-digits.
* \`isValidNpi(s)\`: 10 digits + Luhn over \`"80840" + s\`. Returns a discriminated result (\`FORMAT\` | \`CHECK_DIGIT\` | \`OK\`).
* \`validateSearch(criteria)\`: ≥ 1 criterion besides \`state\`; wildcard needs ≥ 2 leading chars; postal code 5 or 9 digits; page depth ≤ 1000; \`pageSize ∈ {10,25,50,100,200}\`.

The server re-validates everything; the UI's checks are conveniences.

### 3.3 NPPES client (\`nppesClient.ts\`)
The only code that talks to the upstream. Pipeline per call:

1. **Build request** — always \`version=2.1\`; whitelist parameters (drops anything unknown); percent-encode; set \`User-Agent\` with contact mailbox; timeout 8 s connect+read.
2. **Single-flight** — key = canonical query string; identical concurrent requests share one promise (in-process) and a short Redis lock (\`SET NX PX 10000\`) across replicas, with followers polling cache.
3. **Rate limit & concurrency** — Redis token bucket (5 rps, burst 5) and a counting semaphore (4). Interactive requests have priority lane; batch work yields. Waiting longer than 3 s for interactive → fail fast with 503 \`UPSTREAM_BUSY\` rather than queueing indefinitely.
4. **Circuit breaker** — see §6.
5. **Retry** — transport errors and 502/503/504 only, 3 attempts with jittered backoff.
6. **Parse** — JSON parse; if body has \`Errors\` → throw \`NppesValidationError(errors[])\` (**never retried, never cached**); if body lacks both \`results\` and \`Errors\` → \`NppesProtocolError\` (502).
7. **Return** raw payload + timing; mapping to our domain model happens in the mapper.

### 3.4 Mapper (\`providerMapper.ts\`)
Converts the raw NPPES provider object to our normalized model (api-spec B.1) and applies the field-handling rules (A.3): ZIP+4 formatting, \`"--"\` → empty, string epochs, primary taxonomy selection (exactly one \`primary:true\`, else \`anomaly\` flag), LOCATION vs MAILING split (first of each purpose), status mapping (\`A\` → ACTIVE; anything else → DEACTIVATED/UNKNOWN with raw value preserved), unknown-field tolerance. Raw payload is retained alongside for snapshots.

### 3.5 Verification engine (\`verify.ts\`)
Pure function \`verify(provider | null, expected) → VerificationResult\` — no I/O, so exhaustively unit-testable.

* **Name:** normalize both sides (Unicode NFKD, strip diacritics, uppercase, strip punctuation except internal hyphen/apostrophe collapsed, collapse whitespace; remove generational suffixes into a separate field). Match if first+last equal the primary name **or** any \`other_names\` entry; report \`matchedOn: primary|other_name\`. Middle names compared only if provided, with initial-vs-full tolerance.
* **Credential:** normalized token-set comparison (\`M.D.\` = \`MD\`).
* **Taxonomy:** expected code compared to all taxonomies; \`matchedOn: primary|secondary\`; a secondary-only match is MATCH with a note (policy decision in PRD: not a mismatch, but displayed).
* **Location:** state equality required; ZIP compared at 5 digits (or 9 when expected is 9); compared to LOCATION address, never MAILING (a MAILING-only match is \`MISMATCH\` with \`note: MAILING_ONLY\`).
* **Verdict:** per api-spec B.3. Deactivated or not-found short-circuit to FAILED.

Open design caveat: NPPES may not return deactivated NPIs in the API at all, in which case a deactivated provider presents as "not found". The engine therefore treats not-found and status≠\`A\` both as FAILED, and the not-found copy mentions possible deactivation (to be confirmed against a known deactivated NPI in Phase 1; tracked as a risk, test-plan R-06).

### 3.6 Audit & evidence writers
* **Audit writer** appends to \`audit_log\` (Postgres) in the same request lifecycle, via an outbox-style insert **before** returning a response for verification/export actions (fail-closed: if the audit insert fails, the action fails). For high-volume search/lookup reads, the write is synchronous but lightweight; if the DB is unavailable, reads fail-closed too — we prefer unavailability to unaudited access.
* **Evidence writer** stores \`{snapshot_id, npi, raw_payload (jsonb), payload_sha256, expected (jsonb), result (jsonb), retrieved_at, user_id}\`. Insert-only table; a DB role without UPDATE/DELETE; sha256 allows later tamper-evidence checks.

### 3.7 Batch worker (Phase 2)
Postgres-backed queue; one row per batch, one per item. Worker claims items with \`FOR UPDATE SKIP LOCKED\`, processes through the same NPPES client (so limits apply globally), writes result rows; supports cancel (checked between items) and crash recovery (items \`RUNNING\` beyond a lease are re-queued). Batch lane has a lower token-bucket share (max 3 rps) so interactive users are not starved. 500 rows at 3 rps ≈ 3 minutes cold; much faster with cache hits.

### 3.8 UI
React SPA with a typed API client generated from the OpenAPI document. Components: \`OmniSearch\`, \`AdvancedFilters\`, \`ResultsTable\`, \`ProviderDetail\`, \`VerifyPanel\` (left: expected; right: NPPES; center: per-field badges), \`BatchUploader\`, \`AuditExplorer\`, \`Provenance\` strip. State via URL (shareable search links containing no PHI — only public search criteria). WCAG 2.1 AA test gates in CI (axe).

## 4. Data flow

### 4.1 NPI lookup (cache miss)
1. UI → \`GET /providers/1063837144\`.
2. API: authn/z → validator (\`OK\`) → audit "LOOKUP_REQUESTED".
3. Lookup service: Redis \`GET npi:v1:1063837144\` → miss.
4. NPPES client: single-flight → limiter → \`GET …/api/?version=2.1&number=1063837144\`.
5. Response has \`results[0]\` → mapper → normalized provider.
6. Redis \`SETEX\` 24 h (raw + normalized, \`retrievedAt\`).
7. Audit "LOOKUP_COMPLETED {npi, cache: MISS}" → 200 with provenance.

Variants: **zero results** → cache negative sentinel 15 min → 404 \`NPI_NOT_FOUND\`. **\`Errors\` body** → map → 400, no cache. **Transport failure** → retry → breaker → serve stale if present (cache: STALE, banner) else 503.

### 4.2 Search
Canonicalize criteria (lowercase, trim, sorted keys, defaults filled) → key \`search:v1:<sha256(canonical)>\` → TTL 1 h. Stores only the page of summaries plus per-record raw payloads are *not* separately cached from search (a lookup is authoritative for detail). Because NPPES returns full provider objects in search results, the service opportunistically warms \`npi:v1:*\` entries **only if absent**, tagged \`source: search\` with a 1 h TTL, so a click-through avoids another call without extending staleness beyond the search TTL.

### 4.3 Verification
1. \`POST /verifications\` → authz (Verifier).
2. **Cache bypass**: fresh upstream fetch (verification is evidence; it must reflect NPPES *now*). Result also refreshes the 24 h lookup cache.
3. \`verify()\` pure compute.
4. Transaction: insert snapshot + audit row. Commit, then respond 201.
5. Failure of NPPES (transport) → 503; **no snapshot** is written for a failed attempt but an audit row records \`VERIFY_ERROR\`.

### 4.4 Batch
Upload → parse and validate every row locally (Luhn, required columns) → reject bad rows with row numbers → enqueue valid rows → workers verify with cache **allowed** for items (batch tolerates ≤ 24 h staleness; this is a documented difference and the CSV output carries \`retrieved_at\`) → progress polling → CSV. Individual item snapshots are stored (evidence) so the batch is auditable per-NPI.

## 5. Caching strategy

| Cache | Key | TTL | Notes |
|---|---|---|---|
| NPI record | \`npi:v1:{npi}\` | 24 h | Provider records change slowly; NPPES itself updates asynchronously. |
| Negative | \`npi:v1:{npi}:404\` | 15 min | Short: a newly issued NPI should appear quickly. |
| Search page | \`search:v1:{hash}\` | 1 h | Includes \`page\`, \`pageSize\`. |
| Typeahead taxonomy list | \`taxonomy:v1\` | 7 d | Seeded from NUCC code set; refreshed weekly. |
| Errors | — | never | \`Errors[]\` and transport failures are not cached. |

Design points:
* **Versioned keys** (\`v1\`) so a mapper change invalidates by bumping the version, no flush needed.
* **Stale-while-error:** entries are stored with a soft TTL (above) and a hard TTL of 7 days. When upstream fails and the soft TTL has expired, a stale entry is served with \`cache: STALE\` and a visible warning. Verification **never** uses stale data.
* **Stampede protection:** single-flight (§3.3) plus ±10% TTL jitter.
* **Forced refresh** (\`refresh=true\`): bypass read, write-through on success; audited; limited to Verifiers; counts against per-user rate limit.
* **Provenance:** \`retrievedAt\` is stored with the entry and returned to the UI on every read, plus NPPES \`last_updated\` — freshness is never hidden.
* **No caching in browsers** for provider data (\`Cache-Control: private, no-store\`) to keep the audit story clean.

## 6. Error handling

### 6.1 Taxonomy

| Class | Examples | Retry? | Cached? | HTTP out | User sees |
|---|---|---|---|---|---|
| Local validation | not 10 digits, Luhn fail, state-only, short wildcard | no | no | 400 | Field-level message (no upstream call made) |
| Upstream validation | \`Errors[]\` codes 03/05/06/07 | no | no | 400 | Mapped message; indicates our validator missed a rule → increments \`nppes_validation_escape\` metric |
| Upstream contract/config | \`Errors\` 17 | no | no | 500 | "Service misconfigured"; alert |
| Not found | \`result_count: 0\` | no | negative 15 min | 404 | "Valid NPI format, not found in NPPES" |
| Transient transport | timeout, reset, 502/503/504 | yes, 3× | no | 503 if exhausted | "NPPES is temporarily unavailable. Try again." |
| Protocol | 200 with neither \`results\` nor \`Errors\`; invalid JSON | once | no | 502 | Generic + request ID |
| Local limit | per-user rate exceeded | no | no | 429 | "Slow down" with countdown |

### 6.2 Critical rule: HTTP 200 is not success
The NPPES client inspects the body for \`Errors\` before anything else. A unit test with a recorded fixture of each observed error body guards this, and a contract test runs nightly against the live API to detect changes in codes or shapes (§9).

### 6.3 Circuit breaker
Closed → Open after 5 consecutive transport failures or > 50% failures in a 30 s window with ≥ 10 requests. While Open: serve stale where permitted, otherwise immediate 503 with \`retryable: true\` and \`Retry-After: 30\`. Half-open: one probe every 30 s; two successes close. State in Redis so replicas agree. Breaker state surfaces in the UI as a top-of-page banner.

### 6.4 Idempotency & partial failure
All upstream calls are GETs and safe to retry. Batch items are independent; failure of one never fails the batch; \`ERROR\` items can be re-run individually.

### 6.5 Fail-closed vs fail-open
* Audit write fails → request fails (fail-closed).
* Redis unavailable → bypass cache, call NPPES directly under an in-process limiter (degraded, lower caps); alert.
* Postgres unavailable → read endpoints fail (cannot audit).

## 7. Security and privacy

* OIDC SSO; RBAC enforced in middleware and re-checked in services; admin role separate.
* NPPES data is public but access patterns are not; searches are audit-logged. Logs hold request IDs and NPIs, never free-text names beyond the audit table.
* Sole-proprietor addresses may be residential; UI warns; exports carry the same notice.
* CSV exports escape formula-leading characters. Uploads: size/row limits, strict parsing, no server-side evaluation.
* Egress allow-list limited to \`npiregistry.cms.hhs.gov\`; TLS verification on; no HTTP.
* Secrets: none required for NPPES; DB/Redis credentials from the secrets manager.
* Dependency scanning and SAST in CI; threat model review before pilot.

## 8. Operations

* **Metrics:** \`nppes_requests_total{outcome}\`, \`nppes_latency_seconds\`, \`cache_hits_total{type}\`, \`limiter_wait_seconds\`, \`breaker_state\`, \`audit_write_failures_total\`, \`verification_verdict_total{verdict}\`, \`nppes_validation_escape_total\`.
* **Alerts:** breaker open > 5 min; upstream error rate > 5% for 10 min; audit write failure > 0; p95 latency SLO breach.
* **Config (no redeploy):** rate, concurrency, TTLs, feature flags, breaker thresholds.
* **Deployment:** 2+ stateless replicas, rolling deploys; DB migrations backward-compatible; Redis loss is non-fatal.
* **Runbook:** "NPPES down" (confirm via CMS status/probe; breaker handles; communicate to users; manual web UI is fallback), "IP blocked/429" (stop batch lane, reduce rate, contact CMS using the User-Agent contact).
* **Data retention:** audit and snapshots 7 years (partition by month; cold-store after 2 years); cache is ephemeral.

## 9. Testing strategy (summary; see \`test-plan.md\`)

* **Unit:** validator (Luhn vectors), mapper (fixtures from real responses), verification engine (property tests on normalization), limiter math.
* **Contract:** recorded fixtures for success/zero results/each observed \`Errors\`; plus a **nightly live contract test** (the probe in \`evidence/probe.py\` is its seed) that asserts the assumptions in api-spec Part A still hold and pages the team when NPPES changes.
* **Integration:** service with real Redis/Postgres and a fake NPPES server that can inject latency, 5xx, malformed bodies, and \`Errors\`.
* **E2E:** Playwright against the stack + fake NPPES; selected smoke tests against live NPPES gated to a low rate.
* **Non-functional:** load (limiter enforcement under concurrency), accessibility (axe + manual), security (ZAP baseline, upload fuzzing).

## 10. Alternatives considered

| Option | Why not (for now) |
|---|---|
| Call NPPES directly from browsers | Cannot rate-limit/audit/cache centrally; CORS and egress policy issues. |
| Mirror the NPPES bulk dissemination file | Large (multi-GB), monthly cadence plus weekly increments; strong for fuzzy/analytics search but heavy for v2. Revisit if API limits bite (Phase 3). |
| In-memory cache only | Replicas diverge; limiter state per-instance multiplies upstream rate. |
| Third-party NPI APIs | Adds vendor, cost, and a second source of truth; our evidentiary claim is "CMS primary source". |
| Dedicated message broker for batches | Overkill for ≤ 500-row jobs; Postgres queue suffices and is one fewer system. |

## 11. Risks and open items

1. **Deactivated NPI behavior in the API is unconfirmed** (may present as not-found). Verify with a known deactivated NPI in week 1; adjust copy and engine rules.
2. **Undocumented upstream limits.** Conservative defaults; monitor; coordinate with CMS if usage grows.
3. **Name normalization edge cases** (hyphenation, suffixes, transliteration) will cause false REVIEW verdicts; track REVIEW-disposition outcomes to tune.
4. **Search quality is whatever NPPES gives us** (no fuzzy/phonetic guarantees). Set expectations in UX and training.
5. **Audit fail-closed** raises availability coupling to Postgres; accepted trade-off, with HA database.

This document has two parts: **Part A** describes the upstream CMS NPPES NPI Registry API v2.1 as it actually behaves (including behaviors verified by live probe on 2026-10-05; see \`evidence/probe.py\`), and **Part B** specifies the internal REST API our service exposes to the UI.

# Part A — Upstream: CMS NPPES NPI Registry API v2.1

## A.1 Endpoint

\`\`\`
GET https://npiregistry.cms.hhs.gov/api/?version=2.1&<params>
\`\`\`

* Public, no authentication or API key. HTTPS only.
* A single endpoint serves every query; behavior is determined by query parameters.
* \`version\` is **required**. Omitting it or sending an unknown value returns error 17 "Unsupported Version" (observed).
* Responses are \`application/json\` with \`Cache-Control: no-cache, no-store, must-revalidate\`, so intermediaries and browsers will not cache for us — we must cache ourselves.
* No rate-limit headers (\`X-RateLimit-*\`, \`Retry-After\`) were observed. There is no published quota.

## A.2 Query parameters

| Parameter | Type | Notes |
|---|---|---|
| \`version\` | string | **Required.** We always send \`2.1\`. |
| \`number\` | 10-digit string | The NPI. Exact match. NPPES does **not** validate the check digit: a Luhn-invalid but 10-digit value returns \`result_count: 0\`, not an error. A value that is not 10 digits returns error 06. |
| \`enumeration_type\` | \`NPI-1\` \\| \`NPI-2\` | Individual vs. organization. Other values → error 05. |
| \`taxonomy_description\` | string | e.g. \`Cardiology\`, \`Counselor\`. Wildcard rules apply. |
| \`first_name\` | string | NPI-1. Trailing \`*\` wildcard. (Whether it also matches \`other_names\` aliases is not verified; we do not assume it.) |
| \`last_name\` | string | NPI-1. Trailing \`*\` wildcard. |
| \`organization_name\` | string | NPI-2. Trailing \`*\` wildcard; also matches Doing-Business-As names. |
| \`city\` | string | Which address purpose (LOCATION vs MAILING) NPPES matches is not verified; results are shown with both addresses so users can see the match basis. |
| \`state\` | 2-letter code | **Cannot be the only criterion** — error 07 (observed). |
| \`postal_code\` | 5 or 9 digits | Can be combined with other criteria. |
| \`country_code\` | 2-letter code | Not exposed in v2 UI. |
| \`limit\` | integer | Default 10. **Maximum 200**; larger values are silently clamped to 200 (observed: \`limit=300\` → 200 results). |
| \`skip\` | integer | Offset for paging. Observed to work at 1000 and 1200; documentation has historically cited a ceiling of 1000, so we cap at 1000 and do not rely on deeper behavior. |
| \`pretty\` | \`true\` | Formatting only; we don't use it. |

**Wildcards:** a trailing \`*\` requires at least two leading characters (error 03, observed with \`s*\`). Names are case-insensitive.

**Not a general query language:** parameters are ANDed; no OR, no negation, no sorting control, no total-count return.

## A.3 Response shape (success)

\`\`\`jsonc
{
  "result_count": 1,          // number of results in THIS response (page size), NOT a grand total
  "results": [ { ...provider... } ]
}
\`\`\`

\`result_count: 0\` with an empty \`results\` array means no match (not an error).

### Provider object — NPI-1 (individual), abridged from a live response

\`\`\`jsonc
{
  "number": "1063837144",
  "enumeration_type": "NPI-1",
  "created_epoch": "1393416364000",       // string, ms
  "last_updated_epoch": "1619378753000",  // string, ms

  },
  "other_names": [ { "type": "Other Name", "code": "5", "first_name": "JACK", "last_name": "SMITH", "middle_name": "RAE", "prefix": "--", "suffix": "--" } ],
  "addresses": [
    { "address_purpose": "MAILING",  "address_type": "DOM", "address_1": "141 OAK PL", "city": "PITTSBURG", "state": "CA", "postal_code": "945653820", "country_code": "US", "telephone_number": "724-544-3437" },
    { "address_purpose": "LOCATION", "address_type": "DOM", "address_1": "1001 POTRERO AVE", "address_2": "WARD 93", "city": "SAN FRANCISCO", "state": "CA", "postal_code": "941103518", "country_code": "US", "telephone_number": "724-544-3437" }
  ],
  "taxonomies": [
    { "code": "101Y00000X",  "desc": "Counselor", "primary": false, "state": "CA", "license": "60311", "taxonomy_group": "" },
    { "code": "1041C0700X", "desc": "Social Worker, Clinical", "primary": true, "state": "CA", "license": "100708", "taxonomy_group": "" }
  ],
  "identifiers": [],
  "endpoints": [],
  "practiceLocations": []
}
\`\`\`

### Provider object — NPI-2 (organization), differences

\`basic\` carries \`organization_name\`, \`organizational_subpart\` ("YES"/"NO"), \`status\`, \`enumeration_date\`, \`last_updated\`, and authorized-official fields (\`authorized_official_first_name\`, \`_last_name\`, \`_title_or_position\`, \`_credential\`, \`_telephone_number\`, …). \`other_names\` entries use \`type: "Doing Business As"\` with \`organization_name\`.

### Field-handling rules (our integration layer)

| Observation | Rule |
|---|---|
| \`postal_code\` arrives as 5 or 9 digits **without hyphen** (\`945653820\`) | Normalize for display to \`94565-3820\`; compare on first 5 digits unless the enrollment ZIP is 9 digits. |
| Exactly one taxonomy has \`primary: true\` (verified on sample) | Treat \`primary:true\` as authoritative; if none or multiple, flag data anomaly rather than guess. |
| Placeholders \`"--"\` appear for empty prefix/suffix | Treat as empty. |
| Epoch fields are **strings** | Parse to integer ms before use. |
| Numeric-like fields are strings (\`number\`, \`license\`) | Never coerce to integer (leading zeros). |
| Names are upper-case | Compare case-insensitively; display in title case only with the original available. |
| \`identifiers[]\` and \`endpoints[]\` may be empty arrays | UI hides empty sections. |
| Unknown additional fields may appear | Parse permissively; ignore unknown keys; keep raw payload for snapshots. |

## A.4 Error responses

Validation errors are returned with **HTTP 200** and a body containing \`Errors\`; there is no \`results\` key. Example (observed):

\`\`\`json
{"Errors":[{"description":"NPI must be 10 digits","field":"number","number":"06"}]}
\`\`\`

| Number | Field | Observed description | Cause | Our user-facing message |
|---|---|---|---|---|
| \`03\` | e.g. \`last_name\` | Wildcards require at least two leading characters | \`s*\` | "Enter at least two letters before the \\*." |
| \`05\` | e.g. \`enumeration_type\` | Field contains special character(s) or wrong number of characters | \`NPI-3\` | "Provider type must be Individual or Organization." |
| \`06\` | \`number\` | NPI must be 10 digits | \`number=123\` | "An NPI is exactly 10 digits." |
| \`07\` | e.g. \`state\` | Field state requires additional search criteria | \`state\` alone | "Add a name, city, ZIP, or specialty — state alone is too broad." |
| \`17\` | \`version\` | Unsupported Version | missing/unknown \`version\` | Internal error (our bug) — "Service misconfigured"; page on-call. |

Other codes exist upstream and are not exhaustively documented; unknown numbers fall through to a generic message with the \`description\` logged.

**Transport-level:** timeouts, connection resets, and 5xx (including 502/503/504 from the CMS edge) are possible and unpublished in frequency. 4xx for malformed URLs may occur. These are handled by retry/backoff (design §6).

## A.5 Rate-limit and API-citizen etiquette

NPPES publishes no numeric limit. We therefore commit to the following, stricter than any limit we have reason to expect:

1. Server-side only; browsers never call NPPES.
2. ≤ 5 requests/second global (token bucket, burst 5) and ≤ 4 concurrent; both configurable.
3. Identical concurrent requests collapse to one upstream call (single-flight).
4. Cache aggressively (24 h NPI / 1 h search / 15 min negative) because the registry's own caching is disabled.
5. Retry only idempotent GETs, ≤ 3 attempts, exponential backoff 500 ms → 1 s → 2 s with ±25% jitter; stop immediately on \`Errors\` (those are deterministic, not transient).
6. Circuit breaker: open after 5 consecutive transport failures or >50% failures in 30 s over ≥ 10 requests; half-open probe every 30 s.
7. Batch and scheduled work runs at lower priority than interactive requests and respects a daily budget.
8. Send a descriptive \`User-Agent\` (\`<org>-provider-lookup/<version> (contact: <team-mailbox>)\`) so CMS can reach us if we misbehave.
9. Never page beyond \`skip=1000\`; ask users to narrow criteria instead.

# Part B — Internal API (service → UI)

Base path \`/api/v1\`. JSON. Auth: OIDC bearer/session cookie; roles per REQ-013. All responses include \`X-Request-Id\`. Errors use a uniform envelope:

\`\`\`json
{ "error": { "code": "NPI_CHECK_DIGIT_INVALID", "message": "…", "field": "npi", "retryable": false, "requestId": "…" } }
\`\`\`

| HTTP | Meaning |
|---|---|
| 400 | Validation failure (our rules or mapped NPPES \`Errors\`) |
| 401/403 | Not authenticated / role insufficient |
| 404 | Valid NPI, not found in NPPES (\`NPI_NOT_FOUND\`) |
| 429 | Local rate limit (per-user) exceeded; \`Retry-After\` set |
| 502 | NPPES returned unusable output |
| 503 | NPPES unavailable and no (stale) cache available; \`retryable: true\` |

### B.1 \`GET /providers/{npi}\` — Viewer+
Returns one normalized provider.

Query: \`refresh=true\` (Verifier+) bypasses cache.

Errors: \`400 NPI_FORMAT_INVALID\`, \`400 NPI_CHECK_DIGIT_INVALID\`, \`404 NPI_NOT_FOUND\`, \`503 UPSTREAM_UNAVAILABLE\`.

\`\`\`jsonc
// 200
{
  "npi": "1063837144",
  "type": "INDIVIDUAL",
  "status": "ACTIVE",                 // ACTIVE | DEACTIVATED | UNKNOWN(<raw>)
  "name": { "first": "JACKELYN", "middle": "RAE", "last": "KELLEY", "credential": "LCSW" },
  "organization": null,
  "primaryTaxonomy": { "code": "1041C0700X", "description": "Social Worker, Clinical", "license": "100708", "state": "CA" },
  "taxonomies": [ { "code": "…", "description": "…", "primary": true, "license": "…", "state": "…" } ],
  "locationAddress": { "line1": "1001 POTRERO AVE", "line2": "WARD 93", "city": "SAN FRANCISCO", "state": "CA", "postalCode": "94110-3518", "phone": "724-544-3437" },
  "mailingAddress":  { "…": "…" },
  "otherNames": [ { "type": "Other Name", "first": "JACK", "last": "SMITH" } ],
  "soleProprietor": false,
  "identifiers": [], "endpoints": [], "practiceLocations": [],
  "nppes": { "enumerationDate": "2014-02-26", "lastUpdated": "2021-04-25" },
  "provenance": { "source": "CMS NPPES API v2.1", "retrievedAt": "2026-10-05T14:02:11Z", "cache": "HIT|MISS|STALE|BYPASS" }
}
\`\`\`

### B.2 \`GET /providers\` — Viewer+
Search. Query params map to NPPES: \`type\` (INDIVIDUAL|ORGANIZATION → \`enumeration_type\`), \`firstName\`, \`lastName\`, \`organizationName\`, \`taxonomy\`, \`city\`, \`state\`, \`postalCode\`, \`pageSize\` (10|25|50|100|200, default 25), \`page\` (1-based; internally \`skip=(page-1)*pageSize\`).

Validation (before upstream call): at least one criterion besides \`state\`; wildcard rule; \`page*pageSize ≤ 1000\` else \`400 PAGING_DEPTH_EXCEEDED\`.

\`\`\`jsonc
// 200
{
  "items": [ { "npi": "…", "type": "…", "displayName": "…", "primaryTaxonomy": "…", "city": "…", "state": "…", "status": "ACTIVE", "lastUpdated": "2021-04-25" } ],
  "page": 1, "pageSize": 25,
  "hasMore": true,                    // true iff items.length == pageSize (NPPES gives no total)
  "provenance": { … }
}
\`\`\`
There is deliberately no \`total\` field.

### B.3 \`POST /verifications\` — Verifier+
Runs a verification. Always fetches fresh from NPPES, writes an evidence snapshot.

\`\`\`jsonc
// request
{
  "npi": "1063837144",
  "expected": {
    "type": "INDIVIDUAL",                 // optional
    "firstName": "Jackelyn", "lastName": "Kelley", "credential": "LCSW",
    "primaryTaxonomyCode": "1041C0700X",
    "practiceState": "CA", "practiceZip": "94110"
  }
}
// 201
{
  "verificationId": "ver_01J…",
  "verdict": "VERIFIED",                  // VERIFIED | REVIEW | FAILED
  "reason": null,                         // e.g. NPI_NOT_FOUND | NPI_DEACTIVATED | TYPE_MISMATCH
  "fields": {
    "name":       { "result": "MATCH", "expected": "Jackelyn Kelley", "actual": "JACKELYN KELLEY", "matchedOn": "primary" },
    "credential": { "result": "MATCH" },
    "taxonomy":   { "result": "MATCH", "matchedOn": "primary" },     // or "secondary"
    "location":   { "result": "MATCH" }
  },
  "snapshotId": "snap_01J…",
  "nppes": { "lastUpdated": "2021-04-25", "status": "A" },
  "retrievedAt": "2026-10-05T14:02:11Z"
}
\`\`\`
Verdict rules: \`FAILED\` if NPI not found, status ≠ \`A\`, or provided \`type\` ≠ enumeration type. Else \`REVIEW\` if any provided field is \`MISMATCH\`. Else \`VERIFIED\`. \`NOT_PROVIDED\` fields do not affect the verdict but are shown.

\`GET /verifications/{id}\` returns the stored result; \`GET /verifications/{id}/export?format=pdf|json\` returns the evidence artifact.

### B.4 \`POST /batches\` — Verifier+ (Phase 2)
\`multipart/form-data\` with \`file\` (CSV, ≤ 500 data rows, ≤ 1 MB, UTF-8). Header: \`npi\` (required), \`first_name\`, \`last_name\`, \`credential\`, \`taxonomy_code\`, \`state\`, \`zip\`.
Response \`202 { "batchId": "bat_…", "accepted": 483, "rejected": [ { "row": 17, "code": "NPI_CHECK_DIGIT_INVALID" } ] }\`.
\`GET /batches/{id}\` → \`{ status: QUEUED|RUNNING|COMPLETE|CANCELLED|FAILED, processed, total, counts: {VERIFIED, REVIEW, FAILED, ERROR} }\`.
\`DELETE /batches/{id}\` cancels. \`GET /batches/{id}/results.csv\` downloads (formula-injection-safe). Rows with transport failure after retries are marked \`ERROR\` (retryable), not \`FAILED\`.

### B.5 \`GET /audit\` — Auditor+
Filters: \`user\`, \`action\`, \`npi\`, \`from\`, \`to\`; cursor pagination (\`cursor\`, \`limit ≤ 200\`); \`GET /audit/export.csv\`. Read-only; there is no mutation endpoint.

### B.6 Operational
\`GET /healthz\` (liveness), \`GET /readyz\` (readiness, includes cache/DB), \`GET /metrics\` (Prometheus; internal network only). An upstream NPPES outage affects \`/readyz\` detail but does not fail readiness, since stale cache can still serve.

## B.7 Reference: NPI check-digit algorithm
Prefix the 9-digit base with \`80840\`, compute the Luhn check digit; the 10th digit of the NPI must equal it. Equivalent: run Luhn validation on \`80840\` + the full 10-digit NPI and require \`sum % 10 == 0\`. Known valid example from CMS documentation: \`1234567893\`.

    {"id": "US-004", "reqs": ["REQ-009", "REQ-011"], "title": "Resilient NPPES client: error mapping, rate limiting, and circuit breaker", "status": "To Do", "priority": "P0", "assignee": "", "labels": "backend, resilience, integration, REQ-009, REQ-011, phase-1", "desc": "As the platform owner, I want every NPPES call to go through one hardened client, so that we can never overload CMS, never mistake an upstream error for 'no results', and keep working through short outages.\n\nThe upstream contract has traps this client must encode. Validation failures arrive with HTTP 200 and an Errors array rather than a results array, so success must be determined from the body. NPPES publishes no rate limit and sends no rate-limit headers, so we set our own conservative ceilings (5 requests per second, 4 concurrent) and enforce them across replicas. Transient failures need bounded retry with jitter, whereas deterministic Errors must never be retried. Sustained failure should trip a circuit breaker so we stop piling on and can serve stale cache entries.\n\nThis is the highest-risk integration component, so it ships with a fake NPPES server for fault injection that the rest of the team can reuse in integration and end-to-end tests.", "ac": "A 200 response whose body contains Errors is raised as NppesValidationError, is never retried, and is never cached; number 06 maps to a message containing '10 digits', 07 to a message about adding criteria, 03 to the wildcard message.\nError number 17 results in an HTTP 500 'service misconfigured' response and increments an alertable metric.\nUnknown Errors numbers produce a generic user message while the raw description is logged and exposed under 'details'.\nTimeouts, connection resets, and 502/503/504 are retried up to 3 attempts with 500ms/1s/2s backoff plus-or-minus 25% jitter; after exhaustion the API returns 503 UPSTREAM_UNAVAILABLE with retryable=true and never returns 404 or an empty result.\nUnder a load test of 50 concurrent users,
