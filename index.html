    {"id": "US-005", "reqs": ["REQ-010"], "title": "Tiered caching with stale-on-error and visible freshness", "status": "To Do", "priority": "P0", "assignee": "", "labels": "backend, caching, REQ-010, phase-1", "desc": "As an analyst, I want fast repeat lookups that tell me how old the data is, and as the platform owner, I want repeat traffic to be absorbed by cache, so that the tool is quick and kind to NPPES.\n\nNPPES responses carry Cache-Control: no-store, so no intermediary will help us; caching is entirely ours. Provider records change slowly, so NPI lookups are cached 24 hours, search pages 1 hour, and not-found results 15 minutes (a newly issued NPI should be findable soon). Errors are never cached. When NPPES is unreachable, a stale entry within a 7-day hard limit is served with an explicit warning, but verification never uses stale or cached data because it is evidence. A Verifier can force refresh.\n\nCache keys are versioned so a mapper change can invalidate by bumping a version, and TTLs are jittered to avoid synchronized expiry.", "ac": "A second lookup of the same NPI within 24 hours makes zero upstream calls and returns provenance.cache=HIT with the original retrievedAt.\nA first lookup returns provenance.cache=MISS, and the entry is stored with a TTL of 24 hours plus-or-minus 10%.\nA not-found NPI is negatively cached for 15 minutes; a request at minute 16 triggers a new upstream call.\nResponses containing Errors, and transport failures, are never written to cache.\nSearch results are cached per canonical criteria hash including page and pageSize; reordering query-string parameters yields the same cache entry.\nWith the upstream failing and a soft-expired entry younger than 7 days present, the API returns 200 with provenance.cache=STALE and the UI displays a stale-data warning; with no entry it returns 503.\nrefresh=true is rejected with 403 for Viewers; for Verifiers it bypasses the cache read, writes through on success, and produces provenance.cache=BYPASS and an audit entry.\nThe UI always displays retrievedAt and NPPES last_updated, and the browser receives Cache-Control: private, no-store on provider responses.", "subs": ["Implement CacheService over Redis with versioned keys, soft and hard TTLs, jitter, and negative entries.", "Implement canonical search-criteria hashing and unit-test key stability against parameter reordering and case/whitespace differences.", "Integrate stale-while-error logic into LookupService and SearchService with the cache status enum in provenance.", "Add refresh=true handling with RBAC enforcement and audit hook.", "Surface cache status and staleness warning in the Provenance strip and add a stale-data banner component.", "Add integration tests using the fake NPPES server and a controllable clock to verify TTL boundaries."]},
    {"id": "US-006", "reqs": ["REQ-007"], "title": "Verify an enrollment record against NPPES and save evidence", "status": "To Do", "priority": "P0", "assignee": "", "labels": "backend, frontend, verification, REQ-007, phase-1", "desc": "As a Credentialing Specialist, I want to enter what the provider submitted and get a field-by-field verdict against NPPES that I can save as evidence, so that primary source verification of the NPI is documented rather than attested by a checkbox.\n\nVerification compares submitted name, credential, primary taxonomy code, and practice state and ZIP to the NPPES record. It must be tolerant of formatting (case, punctuation, diacritics, M.D. versus MD) and aware of NPPES structure: a name may match an other_names entry rather than the primary name, a taxonomy may match a secondary rather than the primary taxonomy, and location must be compared against the LOCATION address, never the MAILING address. Not-found and non-active records are FAILED regardless of other matches.\n\nVerification always fetches fresh data, writes an immutable evidence snapshot (full payload, SHA-256, expected values, result), and can be exported as PDF and JSON. The comparison logic is a pure function so it can be tested exhaustively without any network.", "ac": "Submitting expected name 'jackelyn kelley', credential 'LCSW', taxonomy 1041C0700X, state CA, ZIP 94110 for NPI 1063837144 returns verdict VERIFIED with every field MATCH.\nChanging expected last name to 'Kelly' yields name=MISMATCH and overall verdict REVIEW with expected and actual values; fields not supplied are NOT_PROVIDED and do not affect the verdict.\nA name matching an other_names entry (SMITH, JACK) returns MATCH with matchedOn=other_name; a taxonomy matching a non-primary taxonomy returns MATCH with matchedOn=secondary.\nAn expected ZIP matching only the MAILING address returns location=MISMATCH with note MAILING_ONLY; ZIP comparison uses the first 5 digits unless a 9-digit ZIP is supplied.\nNPI not found, status other than A, or supplied type different from the enumeration type yields FAILED with a machine-readable reason, even when other fields would match.\nEach successful verification always triggers a fresh upstream fetch (cache=BYPASS) and persists a snapshot whose payload_sha256 matches the SHA-256 of the stored payload; snapshots cannot be updated or deleted by the application DB role.\nExport as JSON returns the snapshot with hash; PDF export includes provenance, verdict, per-field table, and the sole-proprietor notice when applicable.", "subs": ["Implement the pure verify() function and normalization utilities with a table-driven suite of at least 30 cases (diacritics, hyphenated surnames, suffixes such as Jr. and III, apostrophes, middle initial vs full middle name).", "Add POST /verifications and GET /verifications/{id} with Verifier role enforcement and the fresh-fetch (bypass) path.", "Create the evidence_snapshots table, restricted DB role (insert and select only), and the SHA-256 hashing writer inside a transaction with the audit row.", "Build the VerifyPanel UI with expected-fields form, NPPES record view, and textual per-field badges.", "Implement JSON and PDF export with provenance and notices; add the 'Copy verification summary' action.", "Add end-to-end tests for VERIFIED, REVIEW, and each FAILED reason using the fake NPPES server."]},
    {"id": "US-007", "reqs": ["REQ-008"], "title": "Batch verification from CSV for roster onboarding", "status": "Backlog", "priority": "P1", "assignee": "", "labels": "backend, frontend, batch, REQ-008, phase-2", "desc": "As a Provider Data Steward onboarding a medical group, I want to upload a roster of up to 500 NPIs and get verdicts for all of them, so that I stop verifying hundreds of providers one at a time.\n\nBatches must be a good citizen: they run asynchronously in a lower-priority lane with a smaller share of the global rate budget so interactive users aren't starved, and they tolerate partial failure. Each row is validated locally first (required npi, Luhn check, known columns) and bad rows are reported with row numbers instead of aborting the upload. Items use the same verification engine and write per-NPI evidence snapshots; unlike single verification, batch items may use cache entries up to 24 hours old, and the output says so by including retrieved_at.\n\nUsers need progress visibility, the ability to cancel, and a results CSV that is safe to open in a spreadsheet, which means formula-leading characters are neutralized.", "ac": "Uploads over 500 data rows or 1 MB are rejected with 413 stating the limits, and a CSV missing the npi column returns 400 naming it; nothing is partially processed.\nRows with non-10-digit or Luhn-invalid NPIs are rejected at upload with row numbers and codes returned in the 202 body, and the remaining rows proceed.\nGET /batches/{id} reports status, processed, total, and counts by VERIFIED, REVIEW, FAILED, ERROR, refreshed at least every 2 seconds, and DELETE /batches/{id} stops processing at the current item boundary with status CANCELLED while keeping completed results.\nIf NPPES fails for some items after retries, those items are marked ERROR (retryable), the batch still completes, and the rest are unaffected.\nA 500-row batch of previously unseen NPIs never drives the upstream rate above the batch lane ceiling of 3 requests per second, and interactive lookups during the batch complete with p95 under 3 seconds.\nResults CSV contains npi, verdict, reason, per-field results, nppes_last_updated, retrieved_at, and any cell starting with =, +, -, or @ is prefixed with an apostrophe.\nIf the worker process is killed mid-batch, items stuck RUNNING beyond the lease are re-queued and the batch completes without duplicate result rows.", "subs": ["Implement CSV parsing and pre-flight validation (header check, row limits, Luhn, row-numbered rejections) with a downloadable template.", "Create batch and batch_item tables and the Postgres SKIP LOCKED claim loop with leases and crash recovery.", "Wire the worker through NppesClient batch lane with reduced rate share and cache-allowed verification path; write per-item snapshots.", "Implement POST/GET/DELETE /batches endpoints and the results.csv writer with formula-injection escaping.", "Build BatchUploader UI with drag-and-drop, pre-flight summary, progress bar, cancel, and download.", "Add integration tests for partial failure, cancellation, crash recovery, and a lane-fairness test under interactive load."]},
    {"id": "US-008", "reqs": ["REQ-012", "REQ-013"], "title": "Single sign-on, role-based access, and append-only audit trail", "status": "To Do", "priority": "P0", "assignee": "", "labels": "backend, security, compliance, REQ-012, REQ-013, phase-1", "desc": "As a Compliance liaison, I want every access to provider data to be attributable and every verification to be reconstructable, so that I can answer an NCQA or state auditor with evidence instead of recollection.\n\nAlthough NPPES data is public, the pattern of who searched for whom reveals our enrollment pipeline, so the tool is internal-only, authenticated with corporate SSO, and role-gated: Viewers search and view; Verifiers additionally verify, batch, export, and force refresh; Auditors read the audit log and snapshots; Admins manage configuration. Every action is written to an append-only audit table before the response is returned, and the system fails closed: if it cannot audit, it does not serve.\n\nThe audit table is partitioned monthly for a 7-year retention schedule, and the database role used by the app has insert and select only, so even a compromised service cannot rewrite history.", "ac": "Unauthenticated requests to any /api/v1 endpoint except health probes return 401; successful OIDC login establishes a server-side session and no token is stored in browser storage.\nViewer calling POST /verifications, POST /batches, or refresh=true receives 403 and an audit row records the denied attempt.\nAuditor can call GET /audit and GET /verifications/{id} but receives 403 on search and verification-creation endpoints; a Verifier can read only verifications they created (another user's id returns 404).\nEach of LOOKUP, SEARCH, VERIFY, BATCH_CREATE, EXPORT, REFRESH produces exactly one audit row with user id, role, UTC timestamp, action, normalized query, result NPIs (not payloads, for searches), cache hit/miss, verdict where applicable, and request id.\nIf the audit insert fails (simulated DB outage), the original action returns 503 and no provider data is returned to the caller.\nThe application DB role cannot UPDATE or DELETE rows in audit_log or evidence_snapshots, verified by a failing SQL statement in an automated test.\nGET /audit supports filtering by user, action, npi, and date range with cursor pagination (limit up to 200) and CSV export, and an audit row is written for each audit export.\nApplication logs for a name search do not contain the searched name text beyond the audit table.", "subs": ["Integrate OIDC login with server-side sessions and map IdP groups to Viewer, Verifier, Auditor, and Admin roles.", "Implement RBAC middleware plus service-layer re-checks and the denied-attempt audit path.", "Create audit_log (monthly partitions) and the restricted DB role; implement the synchronous fail-closed AuditWriter and request-ID propagation.", "Instrument every endpoint with audit actions through a single decorator to avoid missed paths; add a test that enumerates routes and fails if one lacks an audit action.", "Build the AuditExplorer UI (filters, pagination, CSV export) for the Auditor role.", "Write log-redaction tests and security tests for role bypass attempts and the DB-privilege assertions."]},
  ],
  plan:{saved:false,prompt:'',note:'',busy:false,sections:[
    {t:"Objectives",x:"Demonstrate, with evidence, that each requirement in the PRD (REQ-001 to REQ-013) is met, not merely that code exists.\nProve the product handles the real NPPES v2.1 contract: HTTP 200 with Errors, no server-side check-digit validation, result_count = page size, silent limit clamp at 200, Cache-Control: no-store.\nProve we are a safe consumer of a shared public service: limits hold under concurrency and across replicas, and outages degrade gracefully.\nProve the audit and evidence properties Compliance depends on: completeness, immutability, fail-closed.\nDetect upstream contract drift early through a standing live contract check."},
    {t:"In scope",x:"All functional requirements REQ-001 – REQ-013\nInput validation (client and server), NPPES payload mapping, verification engine, caching, rate-limit and circuit-breaker behavior, error mapping, RBAC, audit/evidence integrity, batch processing, CSV/PDF/JSON export\nNon-functional: performance on cache hit/miss, accessibility (WCAG 2.1 AA), security baseline (authz, upload, CSV injection), observability signals for runbooks\nBrowsers: current and previous major versions of Edge, Chrome, Safari"},
    {t:"Out of scope",x:"Correctness of NPPES data itself (self-reported; we verify we represent it faithfully, not that it is true)\nLicensure, sanctions, board certification or any non-NPPES source (PRD non-goals)\nNPPES availability/performance SLAs (we test our response to degradation)\nLoad testing the live NPPES API at scale: prohibited; all load and fault tests run against the fake NPPES server\nCredentialing-system integration (Phase 3)\nMobile and legacy browsers"},
    {t:"Test types",x:"Unit: Luhn/NPI validator vectors, search-criteria validator, mapper fixtures, verification engine (table-driven + property tests), limiter and backoff math (Vitest/Jest)\nContract (recorded): NPPES client vs fixtures for success, zero results, Errors 03/05/06/07/17, truncated JSON, empty body\nContract (live, scheduled): probe-derived suite hitting real NPPES nightly at ≤ 20 requests; asserts api-spec Part A assumptions\nIntegration: service + Redis + Postgres + fake NPPES with fault injection; 2 replicas for limiter tests (Testcontainers)\nAPI: every endpoint, role matrix, error envelope, status codes (Schemathesis against OpenAPI)\nE2E / UI: search, lookup, detail, verify, batch, audit explorer flows (Playwright)\nNon-functional: performance (k6 vs fake NPPES, 50 concurrent users) and accessibility (axe in CI + manual NVDA/VoiceOver pass)\nSecurity: authN/Z bypass, IDOR on verification/snapshot ids, CSV upload fuzzing, formula injection, log redaction, DB privilege assertions\nUAT and exploratory: pilot analysts compare time-to-verify to baseline; charters on diacritics/hyphens, sole proprietors, deactivated NPIs, orgs with many DBAs"},
    {t:"Environments",x:"Local/CI: unit, contract, integration against the fake NPPES (containers) with fixtures\nDev: developer integration and E2E; fake NPPES by default, live switch for smoke\nQA/Staging: full regression, performance, security, accessibility; fake NPPES for load/fault, live NPPES for smoke and contract only at ≤ 1 rps; mirrors prod topology (2 replicas, shared Redis, Postgres with monthly partitions, non-prod IdP with a test account per role)\nPilot (Prod): UAT with live NPPES and real data under audit\nReference NPIs: 1063837144 (NPI-1) and 1255498432 (NPI-2); synthetic 1234567893 (not found) and 1063837145 (check digit invalid). No production enrollment data in any test environment"},
    {t:"Entry criteria",x:"PRD, design and api-spec baselined; acceptance criteria reviewed by QA for testability\nBuild deployed to the target environment with green CI (unit + contract + lint + SAST)\nFake NPPES server available and documented; reference NPIs verified against live NPPES within the last 24 hours\nTest accounts for Viewer, Verifier, Auditor, Admin provisioned\nEgress allow-list for npiregistry.cms.hhs.gov confirmed for staging\nFor performance testing: staging dedicated, no other load"},
    {t:"Exit criteria",x:"Phase 1: 100% of P0 test cases executed, ≥ 95% passing; every failure triaged, no Sev-1 or Sev-2 open\nEvery P0 requirement (REQ-001–007, 009–013) has a PROVEN verdict in proof-report.md; upstream-premise evidence alone is PARTIAL, not PROVEN\nLive contract suite green for 5 consecutive nightly runs\nLimiter test: zero windows exceeding 5 rps or 4 concurrent at the fake NPPES across 2 replicas\nAudit completeness: 0 unaudited actions across the route enumeration test and a 1,000-action randomized run\naxe: zero serious/critical violations; security: no open High findings; role-bypass and DB-privilege tests green\nPerformance: p95 ≤ 150 ms server overhead on cache hit; ≤ 3 s end-to-end on cache miss with 1 s simulated upstream latency\nPhase 2 (batch): all P1 cases pass; lane-fairness and crash-recovery green; 500-row batch completes within 5 minutes cold"},
    {t:"Risks & mitigations",x:"R-01 Upstream drift (Medium/High) → nightly live contract check, permissive parser, versioned fixtures, alert routing\nR-02 Test data mutability (Medium/Medium) → assert structure over exact values; nightly reference check; swap reference NPI on drift\nR-03 Accidental upstream abuse from tests (Low/High) → harness refuses load tests when base URL is non-fake; CI egress block\nR-04 Flaky rate-limit/timing tests (High/Medium) → controllable clock and fake-server counters; assert on server-side windows\nR-05 Name-normalization false verdicts (High/Medium) → large table-driven suite, exploratory charters, track REVIEW dispositions in pilot\nR-06 Deactivated-NPI behavior unconfirmed (Medium/Medium) → week-1 probe with a known deactivated NPI; TC-008 covers both paths; update api-spec\nR-07 Audit fail-closed couples availability to Postgres (Medium/Medium) → HA Postgres, failover chaos test, clear 503 messaging\nR-08 Skip ceiling uncertainty (Low/Low) → cap at 1000 in our API; contract check logs deeper behavior\nR-09 Evidence reproducibility (Medium/Medium) → immutable snapshots with payload hash; tests assert independence from later fetches\nR-10 Schedule compression squeezes accessibility/security testing (Medium/High) → gate in exit criteria; axe in CI from the first UI story"},
  ]},
  tests:[
    {"id": "TC-001", "type": "Functional", "priority": "P0", "reqs": ["REQ-001"], "title": "Lookup of a valid, registered NPI returns the matching record", "steps": "Authenticate as a Viewer.\nEnter ' 1063-837 144 ' (with spaces and hyphen) in the omni search box and submit.\nObserve the network call and the rendered result.", "exp": "Input is normalized to 1063837144 and passes Luhn validation (80840 prefix). Exactly one upstream call is made with version=2.1&number=1063837144. API returns 200 with npi=1063837144, type INDIVIDUAL, status ACTIVE and a provenance block (retrievedAt, cache=MISS). UI renders the provider detail."},
    {"id": "TC-002", "type": "Negative", "priority": "P0", "reqs": ["REQ-001"], "title": "Malformed and check-digit-invalid NPIs are rejected locally with specific messages; valid-but-unregistered NPI is reported as not found", "steps": "Enter '123' and submit; record the message and count upstream calls.\nEnter '1063837145' (10 digits, Luhn-invalid); record the message and count upstream calls.\nEnter '1234567893' (Luhn-valid, not registered); record the message and upstream calls.", "exp": "'123' -> 400 NPI_FORMAT_INVALID ('An NPI is exactly 10 digits'), zero upstream calls. '1063837145' -> 400 NPI_CHECK_DIGIT_INVALID ('likely typo'), zero upstream calls. '1234567893' -> exactly one upstream call, 404 NPI_NOT_FOUND, message 'valid NPI format, not found in NPPES' without the word 'invalid'. Premise check: NPPES itself returns result_count 0 for the Luhn-invalid value, which is why local validation is required."},
    {"id": "TC-003", "type": "Functional", "priority": "P0", "reqs": ["REQ-002"], "title": "Individual search by name and state, with wildcard rule enforcement", "steps": "Search type Individual, last name 'smith', first name 'john', state CA, page size 10.\nInspect the upstream request parameters and the returned items.\nSearch last name 's*' with state CA and attempt to submit.", "exp": "First search sends enumeration_type=NPI-1, last_name=smith, first_name=john, state=CA, limit=10, skip=0 and returns only INDIVIDUAL items with npi, displayName, primaryTaxonomy, city, state, status, lastUpdated. The 's*' search is blocked client-side; if sent directly to the API it returns 400 WILDCARD_TOO_SHORT with zero upstream calls (NPPES would return error 03)."},
    {"id": "TC-004", "type": "Functional", "priority": "P0", "reqs": ["REQ-003"], "title": "Organization search returns NPI-2 records with DBA names", "steps": "Choose type Organization; enter organization name 'mayo*'; submit.\nOpen a result that has a 'Doing Business As' other name (e.g., NPI 1255498432).\nCheck displayed fields.", "exp": "Request uses enumeration_type=NPI-2 and organization_name=mayo*. All items are ORGANIZATION type. The row/detail shows the legal organization name, the DBA name from other_names, and the authorized official's name and title when present; no individual-only fields (first name, sex, credential) are shown."},
    {"id": "TC-005", "type": "Functional", "priority": "P0", "reqs": ["REQ-004"], "title": "Filter combinations and the state-only guard", "steps": "Attempt a search with only state=CA.\nSearch with postal_code 94110 and type Individual.\nSearch with taxonomy 'Cardiology' and state NY.\nEnter a 4-digit ZIP '9411' and a 9-digit ZIP '94110-3518'.", "exp": "State-only is blocked in the UI with an explanation and returns 400 CRITERIA_INSUFFICIENT from the API with zero upstream calls (NPPES error 07). ZIP+type and taxonomy+state searches succeed. A 4-digit ZIP is rejected locally; the 9-digit ZIP is sent as digits only (941103518)."},
    {"id": "TC-006", "type": "Functional", "priority": "P0", "reqs": ["REQ-005"], "title": "Pagination uses limit/skip, never shows a total, and enforces depth and size caps", "steps": "Run a broad search (last name 'smith', state CA) with page size 25; click Next twice.\nCapture upstream skip/limit for each page.\nCall the API directly with pageSize=300, then with pageSize=200&page=6.\nInspect the response and page for any total count.", "exp": "Pages map to skip=0, 25, 50 with limit=25; label reads 'Showing 26-50' etc.; no 'of N' text and no total field in the API response; hasMore is true when a full page is returned. pageSize=300 -> 400 (only 10/25/50/100/200 allowed). page 6 at size 200 (depth 1200 > 1000) -> 400 PAGING_DEPTH_EXCEEDED and UI prompts to narrow criteria. Premise check: NPPES result_count equals page size (not a total) and limit above 200 is silently clamped to 200."},
    {"id": "TC-007", "type": "Functional", "priority": "P0", "reqs": ["REQ-006"], "title": "Detail view separates addresses, marks the primary taxonomy, and formats ZIP+4", "steps": "Open the detail view for NPI 1063837144.\nLocate the taxonomy list, the address cards, and the provenance strip.\nOpen a record with sole_proprietor=YES (fixture) and a record with an empty identifiers array.", "exp": "Exactly one taxonomy is labeled 'Primary' (Social Worker, Clinical, 1041C0700X) and listed first; the secondary (Counselor, 101Y00000X) shows license and state. 'Practice Location' (1001 Potrero Ave...) and 'Mailing Address' (141 Oak Pl...) appear as distinct labeled cards. Postal codes render as 94110-3518 and 94565-3820. Provenance strip shows source, retrievedAt, cache status and NPPES last_updated. The sole-proprietor record shows the residence notice; empty sections are hidden."},
    {"id": "TC-008", "type": "Functional", "priority": "P0", "reqs": ["REQ-007"], "title": "Verification verdicts: VERIFIED, REVIEW, and FAILED paths including other_names, secondary taxonomy, and MAILING-only ZIP", "steps": "As a Verifier, verify NPI 1063837144 with name 'jackelyn kelley', credential LCSW, taxonomy 1041C0700X, state CA, ZIP 94110.\nRepeat with last name 'Kelly'.\nRepeat with name 'Jack Smith' and taxonomy 101Y00000X (secondary).\nRepeat with ZIP 94565 (the MAILING ZIP only).\nVerify NPI 1234567893 (not found) with otherwise plausible data.\nVerify a fixture record with status 'I' (non-active) with data that would match; also verify with expected type ORGANIZATION against an individual NPI.", "exp": "(1) VERIFIED, all fields MATCH. (2) REVIEW, name MISMATCH showing expected and actual. (3) name MATCH matchedOn=other_name, taxonomy MATCH matchedOn=secondary, verdict VERIFIED. (4) location MISMATCH with note MAILING_ONLY, verdict REVIEW. (5) FAILED reason NPI_NOT_FOUND. (6) FAILED reason NPI_DEACTIVATED and FAILED reason TYPE_MISMATCH even though other fields match. Each run triggers a fresh upstream fetch (cache=BYPASS) and returns a snapshotId."},
    {"id": "TC-009", "type": "Functional", "priority": "P1", "reqs": ["REQ-008"], "title": "Batch verification handles bad rows, partial upstream failure, cancellation, and CSV injection", "steps": "Upload a 500-row CSV with 20 rows containing malformed or Luhn-invalid NPIs, one row with a name cell beginning '=HYPERLINK(...)'.\nConfigure the fake NPPES to fail 10 specific NPIs with 503 for the whole run.\nPoll GET /batches/{id} while running; cancel a second identical batch halfway.\nDownload results.csv for the first batch and open it in a spreadsheet.\nUpload a 501-row file and a CSV missing the npi column.", "exp": "Upload returns 202 with 480 accepted and 20 rejected with row numbers and codes. Batch completes; 10 items are ERROR (retryable), the others have verdicts; counts sum to 480. Progress updates at least every 2 seconds. Cancellation yields CANCELLED, keeps completed items, and stops further upstream calls. Fake NPPES logs show batch-lane rate never exceeds 3 rps. CSV cells beginning with = are prefixed with an apostrophe and are not evaluated. 501 rows -> 413; missing column -> 400 naming npi."},
    {"id": "TC-010", "type": "Negative", "priority": "P0", "reqs": ["REQ-009"], "title": "NPPES 'Errors' bodies delivered with HTTP 200 are treated as errors and mapped to field-level messages", "steps": "Using the fake NPPES (and, for the probe, the live API), force responses for error numbers 03, 05, 06, 07 and 17 each with HTTP 200 and an Errors array.\nForce an unknown error number 99 with HTTP 200.\nObserve API status codes, UI messages, cache contents, and retry counts.", "exp": "Every Errors body is treated as a failure although HTTP status is 200. 03/05/06/07 -> 400 with the mapped field-level message; 17 -> 500 'service misconfigured' plus alert metric; unknown 99 -> generic message with raw description under 'details' and in logs. Zero retries for any of them; nothing cached; nppes_validation_escape metric increments for 03/05/06/07 reaching upstream. A body with neither results nor Errors -> 502."},
    {"id": "TC-011", "type": "Resilience", "priority": "P0", "reqs": ["REQ-009"], "title": "Transport failures are retried with backoff and never presented as 'no results'", "steps": "Configure the fake NPPES to respond 503 to the first two requests then 200.\nLook up NPI 1063837144 and record upstream attempt timestamps.\nConfigure the fake to respond 503 indefinitely and to hang beyond the 8 s timeout; repeat the lookup and a search.\nInspect responses and UI text.", "exp": "Case 1 succeeds on attempt 3 with delays about 0.5 s and 1 s (+/-25%). Case 2 makes exactly 3 attempts then returns 503 UPSTREAM_UNAVAILABLE with retryable=true; the UI says NPPES is temporarily unavailable and offers retry. Under no failure mode does the API return 404 or an empty result list. Timeouts are enforced at 8 s."},
    {"id": "TC-012", "type": "Functional", "priority": "P0", "reqs": ["REQ-010"], "title": "Cache TTLs, negative caching, stale-on-error, forced refresh, and visible freshness", "steps": "Look up an NPI twice; compare upstream call counts and provenance.\nAdvance the controllable clock 24h+; look up again.\nLook up an unregistered NPI; repeat at +10 minutes and +16 minutes.\nCause an upstream error response; confirm nothing is cached.\nWith a soft-expired entry present, make the fake NPPES fail and look up again; then repeat for an NPI with no entry.\nAs Viewer and as Verifier, call with refresh=true. Run a verification on a cached NPI.", "exp": "Second lookup: zero upstream calls, cache=HIT with original retrievedAt. After 24h(+/-10%) a new upstream call occurs (MISS). Not-found: second call at +10 min is served from negative cache, at +16 min triggers upstream. Errors/transport failures are never cached. Stale entry (<7 days) served with 200, cache=STALE and a visible warning; no entry -> 503. refresh=true -> 403 for Viewer; for Verifier cache=BYPASS, cache written through, audit row recorded. Verification always fetches fresh regardless of cache. Browser response has Cache-Control: private, no-store; UI shows retrievedAt and NPPES last_updated."},
    {"id": "TC-013", "type": "Performance", "priority": "P0", "reqs": ["REQ-011"], "title": "Rate limit, concurrency ceiling, single-flight, and circuit breaker hold under load across replicas", "steps": "Run 2 service replicas against the fake NPPES, which records request timestamps and in-flight count.\nDrive 50 concurrent virtual users issuing distinct NPI lookups for 5 minutes.\nSend 10 simultaneous identical lookups.\nMake the fake NPPES fail 5 consecutive requests; keep failing for 2 minutes; then recover.\nInspect captured traffic and response headers.", "exp": "Fake server shows <=5 requests in any 1-second window and <=4 concurrent in-flight at all times. Ten identical requests yield exactly one upstream call and ten identical results. After 5 consecutive failures the breaker opens: no upstream calls except one probe per 30 s, responses carry Retry-After: 30 and stale entries are served where present. After recovery two successful probes close the breaker. Every upstream request includes version=2.1, whitelisted params only, and the contact User-Agent. Interactive p95 <= 3 s throughout."},

function reviseLines(text,p){
  p=p.toLowerCase();const lines=text.split('\n').filter(x=>x.trim());let add=null;
  if(/idempot/.test(p))add='Repeating an identical lookup returns the same record and an unchanged retrievedAt while cached (idempotent read, zero extra upstream calls)';
  else if(/error|422|400|reject/.test(p))add='Every error uses the uniform envelope with code, message and requestId; an NPPES Errors body delivered with HTTP 200 is never shown as "no results"';
  else if(/perf|latency|fast|speed/.test(p))add='p95 server overhead ≤ 150 ms on cache hit and ≤ 3 s end-to-end on cache miss';
  else if(/audit|log/.test(p))add='Each action writes exactly one audit row with user id, role, UTC timestamp, normalized query and request id';
  else if(/cache|stale|fresh/.test(p))add='The UI shows retrievedAt, cache status and NPPES last_updated alongside every result';
  if(add)return(lines.includes(add)?lines:[...lines,add]).join('\n');
  const t=lines.map(l=>l.replace(/\bshould\b/g,'must').replace(/\bcan\b/g,'must be able to').replace(/\s+/g,' ').trim());
  const f='All criteria are verifiable from the API response and its provenance block alone';
  return(t.join('\n')!==lines.join('\n')?t:(t.includes(f)?t:[...t,f])).join('\n');
}
function reviseTest(t,p){
  p=p.toLowerCase();const e=t.exp.split('\n');let add;
  if(/idempot/.test(p))add='Repeating the call returns an identical record with the same retrievedAt while cached';
  else if(/error|422|400/.test(p))add='Error body uses the uniform envelope with a code and requestId, and is never presented as "no results"';
  else if(/perf|latency/.test(p))add='Server overhead p95 ≤ 150 ms on cache hit';
  else if(/audit|log/.test(p))add='Exactly one audit row is written with user id, action and request id';
  else add=t.exp.includes('provenance')?'Audit row is written with user id, action and request id':'Response includes a provenance block (source, retrievedAt, cache status)';
  return e.includes(add)?t.exp:t.exp+'\n'+add;
}
function revisePlan(p){
  p=p.toLowerCase();const x=S.plan.sections;let i,line;
  if(/risk/.test(p)){i=7;line='Top risks are reviewed before each run: upstream drift (R-01), limiter flakiness (R-04), deactivated-NPI behavior (R-06)'}

  else if(/boundar|edge|limit/.test(p)){i=3;line='Boundary: wildcard with exactly 2 leading characters, page 5 at size 200 (depth 1,000), 500-row vs 501-row batch'}
  else if(/negative|error/.test(p)){i=3;line='Negative: NPPES Errors 03/05/06/07/17 delivered with HTTP 200 never surface as "no results"'}

}

function barHTML(k){
  const c=CFG[k],items=c.items(),un=items.filter(x=>!x.saved).length;
  if(!un&&S.confirmed[k])return `<div class="bar-in fade"><div class="bar-msg ok">${CHECK}<span>${c.msg(items.length)}</span></div><button class="btn" data-act="go" data-n="${c.next}">${c.nextLabel} →</button></div>`;
  return `<div class="bar-in"><div class="bar-msg">${un?(k==='plan'?'Plan is an AI draft until saved':`${un} of ${items.length} unsaved · dashed or grey-ruled items are AI drafts`):'Nothing to save'}</div>${un?HINT:''}<button class="btn" data-act="save" data-k="${k}" ${un?'':'disabled'}>${c.save}</button></div>`;
}
function refreshBar(k){const b=$('#bar');if(b&&CFG[k])b.innerHTML=barHTML(k)}

/* ---------- screens ---------- */
function extraRow(f,i){
  return `<div class="drop extra" data-drop="${i}">${FILE}<div class="grow"><input type="text" class="lbl-in" data-p="extra|${i}|label" value="${esc(f.label)}" placeholder="Document label" aria-label="Document label"><div class="meta">${f.name?`<span class="fn">${esc(f.name)}</span> · ${f.size} · uploaded`:'Drop a file here or choose one'}</div></div><button class="link" data-act="view" data-k="extra" data-i="${i}">View</button><button class="link" data-act="pick" data-i="${i}">${f.name?'Replace':'Choose file'}</button><button class="x" data-act="rmExtra" data-i="${i}" aria-label="Remove ${esc(f.label||'document')}">×</button></div>`;
}
function startView(){
  const docs=S.files.filter(f=>!f.removed).length+S.extra.length;
  return head('Start with your source documents','Being Agile reads your documents and drafts stories, a test plan and test cases. You review each level, then approve it.')+
  `<div class="drops">${S.files.map((f,i)=>f.removed?`<button class="drop empty" data-act="restore" data-i="${i}" aria-label="Add ${f.name}">${FILE}<div><div class="fn">Drop ${f.name} here</div><div class="meta">or click to choose a file · ${esc(f.kind)}</div></div></button>`:`<div class="drop">${FILE}<div class="grow"><div class="fn">${f.name}</div><div class="meta">${esc(f.kind)} · ${f.size} · uploaded</div><div class="meta" style="margin-top:4px">${esc(f.peek)}</div></div><button class="link" data-act="view" data-k="files" data-i="${i}">View</button><button class="link" data-act="replace" data-i="${i}">${f.busy?'Reading…':'Replace'}</button><button class="link" data-act="remove" data-i="${i}">Remove</button></div>`).join('')}${S.extra.map(extraRow).join('')}</div>
  <div class="addrow"><button class="btn quiet" data-act="addDoc">+ Add another document</button></div>
  <button class="btn" data-act="generate" ${S.generating||!docs?'disabled':''}>${S.generating?'Generating…':'Generate stories'}</button>
  <p class="how"><b>How this works.</b> AI drafts → you edit → you save → approved in-app. Nothing leaves this app.</p>`;
}
const VIEWS=[
  startView,
  ()=>head('Stories',`${S.stories.length} stories drafted from your documents. Edit anything directly, or open a story for its full detail panel. Dashed or grey-ruled means draft.`,csvBtn('stories'))+
    `<div id="list">${S.stories.map(storyCard).join('')}</div><div class="bar" id="bar">${barHTML('stories')}</div>`,
  ()=>head('Test plan','A strategy-level plan derived from the saved stories: scope, test types, criteria and risks. The next step turns it into test cases.',csvBtn('plan'))+
    `<div id="planbox">${planInner()}</div><div class="bar" id="bar">${barHTML('plan')}</div>`,
  ()=>head('Test cases',`${S.tests.length} cases generated from the saved stories and test plan, each tagged with the requirements it proves.`,csvBtn('tests'))+
    `<div id="list">${S.tests.map(testCard).join('')}</div><div class="bar" id="bar">${barHTML('tests')}</div>`,
  ()=>head('Run',`Execute the ${S.tests.length} test cases. This is a planning-stage run: <span style="font-family:var(--mono);font-size:13px">no product build exists yet</span>, so the entry criterion “build deployed” is not met and cases cannot be asserted against the product.`)+
    `<button class="btn" data-act="exec" id="exec" ${S.run.state==='running'?'disabled':''}>${S.run.state==='idle'?'Execute tests':S.run.state==='running'?'Running…':'Run again'}</button>
    <div class="progress"><i id="pg"></i></div><div id="rows"></div><div id="sum"></div>`,
  reportHTML,
];
function render(){
  renderSteps();
  $('#app').innerHTML=`<div class="screen s${S.screen} fade">${VIEWS[S.screen]()}</div>`;
  if(S.screen===SCR.RUN)paintRun();
  renderPanel();renderViewer();growAll();
}
/* repaint just the editable region of one level without losing the rest of the page */
function paint(k){
  if(k==='stories'&&S.screen===SCR.STORIES){$('#list').innerHTML=S.stories.map(storyCard).join('');renderPanel()}
  else if(k==='tests'&&S.screen===SCR.CASES)$('#list').innerHTML=S.tests.map(testCard).join('');
  else if(k==='plan'&&S.screen===SCR.PLAN)$('#planbox').innerHTML=planInner();
  growAll();
}
/* S.panel holds the open story and persists across screens; it is only *visible* on the Stories screen */
const panelOpen=()=>S.panel!=null&&S.screen===SCR.STORIES;
function renderPanel(){
  const p=$('#panel'),i=S.panel;
  document.body.classList.toggle('panel-on',panelOpen());
  if(!panelOpen()){
    p.classList.remove('open');p.setAttribute('aria-hidden','true');
    setTimeout(()=>{if(!panelOpen())p.innerHTML=''},320);return;
  }
  const keep=p.querySelector('.panel-b'),top=keep?keep.scrollTop:0;
  p.innerHTML=panelHTML(S.stories[i],i);p.removeAttribute('aria-hidden');p.classList.add('open');
  p.querySelector('.panel-b').scrollTop=top;growAll();
}
/* S.viewer={k:'files'|'extra',i} while a document is open; only visible on the Start screen */
const viewerOpen=()=>S.viewer!=null&&S.screen===SCR.START;
function viewerHTML(v){
  const f=S[v.k][v.i],src=v.k==='files'?DOCS[f.name]:null,title=v.k==='files'?f.name:(f.label||f.name||'Document');
  return `<div class="panel-h"><span class="ttl">${esc(title)}</span><button class="x" data-act="closeDoc" aria-label="Close viewer">×</button></div>
  <div class="panel-b">${src?`<div class="doc">${md(src)}</div>`:`<div class="doc-empty">${FILE}<p><b>No preview — file added locally</b></p><p>We can’t read the contents of files added from your computer.</p></div>`}</div>`;
}
function renderViewer(){
  const p=$('#viewer');
  document.body.classList.toggle('viewer-on',viewerOpen());
  if(!viewerOpen()){
    p.classList.remove('open');p.setAttribute('aria-hidden','true');
    setTimeout(()=>{if(!viewerOpen())p.innerHTML=''},320);return;
  }
  p.innerHTML=viewerHTML(S.viewer);p.removeAttribute('aria-hidden');p.classList.add('open');
}
function paintRun(){
  const rows=$('#rows');if(!rows)return;
  const r=S.run,tot=S.tests.length,done=S.tests.filter(t=>/PASS|FAIL|BLOCKED/.test(r.res[t.id]||'')).length;
  $('#pg').style.width=(done/tot*100)+'%';
  rows.innerHTML=S.tests.map(t=>{const v=r.res[t.id]||'';const c=v==='RUNNING'?'run':v?v.toLowerCase():'';
    return `<div class="row"><span class="id">${t.id}</span><span>${esc(t.title)}</span><span class="chip ${c}">${v||'QUEUED'}</span>${r.notes[t.id]?`<div class="nt">${r.notes[t.id]}</div>`:''}</div>`}).join('');
  const sm=$('#sum');
  if(r.state==='done'){const n=k=>S.tests.filter(t=>r.res[t.id]===k).length;
    sm.innerHTML=`<div class="summary fade"><span><b>${n('PASS')} passed</b> · ${n('FAIL')} failed · ${n('BLOCKED')} blocked</span><span class="grow"></span><button class="btn" data-act="go" data-n="5">View report →</button></div>`;}
  else sm.innerHTML='';
}
function reportHTML(){
  const v=verdicts(),n=k=>v.filter(x=>x.v===k).length;
  return head('Proof report',`<span class="sumline" style="display:flex"><span class="big pv"><b>${n('PROVEN')}</b>PROVEN</span><span class="big pt"><b>${n('PARTIAL')}</b>PARTIAL</span><span class="big fl"><b>${n('FAILED')}</b>FAILED</span></span>Provider Lookup & NPI Verification · baseline (pre-implementation) · 13 requirements · ${S.tests.length} test cases · test plan ${S.plan.saved?'approved':'draft'} · 2026-10-05<br>No product build has been run. PARTIAL means some evidence exists (an upstream probe, or nothing at all) but not enough to show the product meets the requirement.`)+
  `<div>${v.map(x=>`<div class="req"><span class="id">${x.id}</span><span>${x.text}<span class="by">${x.by} · upstream premise: ${x.d.prem} · executed evidence: ${x.d.ev}</span><span class="by" style="font-family:var(--font);margin-top:4px">${x.d.note}</span></span><span class="chip ${x.v.toLowerCase()}">${x.v}</span></div>`).join('')}</div>
  <h2>Gaps in this baseline</h2>
  <div class="finding b"><b>No product code has been run</b><p>All 13 verdicts stay PARTIAL until a build exists and TC-001…TC-015 execute against it.</p></div>
  <div class="finding b"><b>Deactivated NPI behavior is unknown</b><p>Affects REQ-007 reason codes and messaging (R-06): the API may return status ≠ A or omit the record. No deactivated NPI has been probed.</p></div>
  <div class="finding b"><b>Sole-proprietor=YES and NPI-2 variants were seen only in small samples</b><p>One NPI-1 and one NPI-2 were probed; the YES case relies on a fixture.</p></div>
  <div class="finding b"><b>Reference data is mutable</b><p>Probe assertions check structure, not content, except the NPI itself, so exact values such as a DBA string may drift.</p></div>
  <div class="finding b"><b>Timing evidence is thin</b><p>Latency figures come from a handful of calls, not a distribution.</p></div>
  <div class="finding b"><b>Transport-failure and rate-limit behavior of NPPES is unobserved</b><p>We deliberately did not stress the live service; this is only testable against the fake NPPES.</p></div>
  <div class="summary"><span class="grow" style="color:var(--muted);font-size:13.5px" id="exmsg">${S.exported?'Exported as provider-lookup-proof-report.pdf':''}</span><button class="btn quiet" data-act="export">Export report</button></div>`;
}

/* ============================================================
   CONTROLLER — event wiring, state transitions, init
   ============================================================ */
function go(n){S.screen=n;S.max=Math.max(S.max,n);render();window.scrollTo(0,0)}
function download(name,rows){
  const url=URL.createObjectURL(new Blob([toCSV(rows)],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
/* PERSISTENT + RESPONSIVE panel: once open it stays open (opening another story only swaps content);
   only the × / Close / Escape or a viewport narrower than the breakpoint closes it. */
const NARROW=matchMedia('(max-width: 960px)');
NARROW.addEventListener('change',e=>{if(e.matches){closePanel();closeDoc()}});
function openStory(i){
  if(NARROW.matches){toast('Widen the window to open story details');return}
  const first=!panelOpen();S.panel=i;
  $('#list').innerHTML=S.stories.map(storyCard).join('');growAll();renderPanel();
  if(first)$('#panel').focus({preventScroll:true});
}
function closePanel(){if(S.panel==null)return;S.panel=null;if(S.screen===SCR.STORIES)$('#list').innerHTML=S.stories.map(storyCard).join('');renderPanel();growAll()}
function openDoc(k,i){
  if(NARROW.matches){toast('Widen the window to view documents');return}
  const first=!viewerOpen();S.viewer={k,i};renderViewer();
  if(first)$('#viewer').focus({preventScroll:true});
}
function closeDoc(){if(S.viewer==null)return;S.viewer=null;renderViewer()}
function execute(){
  const r=S.run;if(r.state==='running')return;
  r.state='running';r.res={};r.notes={};render();
  let i=0;
  (function step(){
    if(i>=S.tests.length){r.state='done';S.max=Math.max(S.max,SCR.REPORT);if(S.screen===SCR.RUN)render();else renderSteps();return}
    const t=S.tests[i];r.res[t.id]='RUNNING';if(S.screen===SCR.RUN)paintRun();
    setTimeout(()=>{r.res[t.id]=FINAL[t.id]||'BLOCKED';if(RESULT_NOTES[t.id])r.notes[t.id]=RESULT_NOTES[t.id];i++;if(S.screen===SCR.RUN)paintRun();setTimeout(step,150)},520);
  })();
}
/* ---------- events ---------- */
function resolve(path){const k=path.split('|');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];return[o,k[k.length-1],k]}
function dirty(k,i){
  const it=itemOf(k,i);it.saved=false;S.confirmed[k]=false;
  document.querySelectorAll(`[data-b="${k}|${i}"]`).forEach(e=>{e.textContent='AI draft';e.classList.remove('ok')});
  document.querySelectorAll(`[data-card="${k}|${i}"]`).forEach(c=>c.classList.remove('firm'));
  refreshBar(k);
}
document.addEventListener('input',e=>{
  const el=e.target,p=el.dataset.p;if(!p)return;
  const[o,key,k]=resolve(p);o[key]=el.value;
  if(el.tagName==='TEXTAREA')grow(el);
  const rt=el.closest('.rt');if(rt&&el.tagName==='TEXTAREA')rt.querySelector('.rt-prev').innerHTML=md(el.value);
  const root=k[0];if(root==='extra'||key==='prompt')return;
  const i=root==='plan'?0:+k[1];
  dirty(root,i);
  if(root==='stories'){ // keep the list card and the detail panel in step
    if(el.closest('#panel')){$('#list').innerHTML=S.stories.map(storyCard).join('');growAll()}
    else if(S.panel===i)renderPanel();
  }
});
$('#fi').addEventListener('change',e=>{
  const f=e.target.files[0];if(f&&S.pick!=null&&S.extra[S.pick]){setFile(S.extra[S.pick],f);if(S.screen===SCR.START)render()}
  e.target.value='';
});
function setFile(x,f){x.name=f.name;x.size=(f.size/1024).toFixed(1)+' KB'}
const app=$('#app');
app.addEventListener('dragover',e=>{const d=e.target.closest('[data-drop]');if(d){e.preventDefault();d.classList.add('over')}});
app.addEventListener('dragleave',e=>{const d=e.target.closest('[data-drop]');if(d)d.classList.remove('over')});
app.addEventListener('drop',e=>{
  const d=e.target.closest('[data-drop]');if(!d)return;e.preventDefault();
  const f=e.dataTransfer.files[0];if(f){setFile(S.extra[+d.dataset.drop],f)}render();
});

function save(k){
  if(k==='plan')S.plan.saved=true;else coll(k).forEach(x=>x.saved=true);
  S.confirmed[k]=true;
  document.querySelectorAll('[data-card]').forEach(c=>c.classList.add('firm'));
  document.querySelectorAll('[data-b]').forEach(e=>{e.textContent='Saved';if(e.closest('.panel'))e.classList.add('ok')});
  refreshBar(k);
}
function revise(k,i){
  const it=itemOf(k,i),prompt=(it.prompt||'').trim();
  it.busy=true;it.note='';paint(k);
  setTimeout(()=>{
    let before,after,fl=[];
    if(k==='stories'){before=it.ac;it.ac=reviseLines(it.ac,prompt);after=it.ac;fl=['ac-'+i,'pac-'+i]}
    else if(k==='tests'){before=it.exp;it.exp=reviseTest(it,prompt);after=it.exp;fl=['ex-'+i]}
    else{before=JSON.stringify(it.sections);fl=['ps-'+revisePlan(prompt)];after=JSON.stringify(it.sections)}
    it.busy=false;
    const changed=before!==after;
    it.note=changed?'Updated · review and save':'Already tight · no change';
    if(changed){it.saved=false;S.confirmed[k]=false}
    paint(k);refreshBar(k);
    if(changed)fl.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.add('flash')});
  },900);
}
/* toolbar: wrap the selection in markdown (or prefix selected lines for lists), then fire `input` so state + preview update */
const WRAP={b:['**','**'],i:['*','*'],u:['<u>','</u>']};
function format(t,f){
  const{selectionStart:s,selectionEnd:e,value:v}=t;
  if(f==='ul'){const ls=v.lastIndexOf('\n',s-1)+1;t.setRangeText(v.slice(ls,e).split('\n').map(l=>l.startsWith('- ')?l:'- '+l).join('\n'),ls,e,'end')}
  else{const[a,z]=WRAP[f];t.setRangeText(a+v.slice(s,e)+z,s,e,'end');if(s===e)t.setSelectionRange(s+a.length,s+a.length)}
  t.focus();t.dispatchEvent(new Event('input',{bubbles:true}));
}
/* switch Write/Preview: render the preview from the textarea on every switch to it */
function rtTab(b){
  const rt=b.closest('.rt'),pv=b.dataset.t==='preview',t=rt.querySelector('textarea'),p=rt.dataset.p;
  pv?RT_PREV.add(p):RT_PREV.delete(p);
  rt.querySelectorAll('.rt-tabs button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));
  rt.querySelector('.rt-write').hidden=pv;
  const view=rt.querySelector('.rt-prev');view.hidden=!pv;
  if(pv)view.innerHTML=md(t.value);else{grow(t);t.focus()}
}
document.addEventListener('click',handle);
function handle(e){
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,i=+b.dataset.i,k=b.dataset.k;
  if(a==='rtTab')rtTab(b);
  else if(a==='fmt')format(b.closest('.rt').querySelector('textarea'),b.dataset.f);
  else if(a==='go')go(+b.dataset.n);
  else if(a==='replace'){const f=S.files[i];f.busy=true;render();setTimeout(()=>{f.busy=false;if(S.screen===SCR.START)render()},900)}
  else if(a==='remove'||a==='restore'){closeDoc();S.files[i].removed=a==='remove';render()}
  else if(a==='addDoc'){S.extra.push({label:'Additional document',name:'',size:''});render();const r=document.querySelectorAll('.lbl-in');const l=r[r.length-1];l.focus();l.select()}
  else if(a==='rmExtra'){closeDoc();S.extra.splice(i,1);render()}
  else if(a==='pick'){S.pick=i;$('#fi').click()}
  else if(a==='generate'){S.generating=true;render();setTimeout(()=>{S.generating=false;go(SCR.STORIES)},1000)}
  else if(a==='save')save(k);
  else if(a==='savePanel'){const s=S.stories[i];s.saved=true;S.confirmed.stories=S.stories.every(x=>x.saved);$('#list').innerHTML=S.stories.map(storyCard).join('');renderPanel();refreshBar('stories');toast(s.id+' saved')}
  else if(a==='open')openStory(i);
  else if(a==='close')closePanel();
  else if(a==='view')openDoc(k,i);
  else if(a==='closeDoc')closeDoc();
  else if(a==='addSub'){S.stories[i].subs.push('');dirty('stories',i);$('#list').innerHTML=S.stories.map(storyCard).join('');renderPanel();const r=document.querySelectorAll('#panel .subrow input');r[r.length-1].focus()}
  else if(a==='rmSub'){S.stories[i].subs.splice(+b.dataset.j,1);dirty('stories',i);$('#list').innerHTML=S.stories.map(storyCard).join('');renderPanel()}
  else if(a==='revise')revise(k,i);
  else if(a==='csv'){download(CSVNAME[k],csvRows(k));toast('Exported '+CSVNAME[k])}
  else if(a==='exec')execute();
  else if(a==='export'){S.exported=true;b.textContent='Exported';$('#exmsg').textContent='Exported as provider-lookup-proof-report.pdf'}
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&viewerOpen()){closeDoc();return}
  if(e.key==='Escape'&&panelOpen()){closePanel();return}
  if(!(e.metaKey||e.ctrlKey)||e.altKey||e.shiftKey||e.key.toLowerCase()!=='s')return;
  const btn=panelOpen()?$('#panel [data-act="savePanel"]'):$('#bar [data-act="save"]:not([disabled])');
  if(!btn)return;
  e.preventDefault();btn.click();
});
render();
</script>
</body>
</html>
